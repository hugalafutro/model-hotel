# Docker Compose override for local development.
# Usage: docker compose -f docker-compose.yml -f compose.dev.yml up -d
#
# Changes from production defaults:
#   - Docker socket mounted (container-level stats in sidebar)
#   - DEBUG_LOG=true (verbose structured logging)
#   - ALLOW_EMBED=true (workspace browser embedding)
#   - KNOWN_PROXIES / TRUSTED_PROXIES read from .env, with the docker bridge
#     range as the TRUSTED_PROXIES dev fallback
#
# ⚠️  Docker socket access allows the container to control the Docker daemon.
#     Only use in trusted development environments.

services:
    app:
        restart: unless-stopped
        environment:
            - DEBUG_LOG=true
            # Allow embedding in workspace browsers (e.g. Cursor, VS Code).
            # Not enabled in production compose to keep frame-protection headers.
            - ALLOW_EMBED=true
            # Proxy CIDRs come from the gitignored .env so private addresses
            # never land in the repo. TRUSTED_PROXIES makes sessions record
            # the real client IP from X-Forwarded-For instead of the proxy
            # address - but only when the peer is in the trusted list. The dev
            # default trusts the docker bridge range, which is where a
            # host-forwarded reverse proxy appears from inside the container.
            # ${VAR-default} (no colon) so an explicit TRUSTED_PROXIES= in .env
            # can turn the trust OFF; :- would resurrect the fallback.
            - KNOWN_PROXIES=${KNOWN_PROXIES-}
            - TRUSTED_PROXIES=${TRUSTED_PROXIES-172.16.0.0/12}
            # Observability passthroughs, same .env pattern as the proxy CIDRs
            # above: all three are inert when .env does not define them (empty
            # LOG_FORMAT falls back to text, an empty OTLP endpoint disables
            # the export, an empty METRICS_TOKEN behaves like an unset one).
            # With them in .env a plain `make docker-build` keeps the local
            # observability overlay's log/metric/trace exports wired instead
            # of silently dropping them on every rebuild.
            - LOG_FORMAT=${LOG_FORMAT-}
            - METRICS_TOKEN=${METRICS_TOKEN-}
            - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT-}
            - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME-model-hotel-dev}
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
