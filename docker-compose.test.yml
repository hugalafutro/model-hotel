# Ephemeral test database - auto-creates 'testdb', no persistent volumes.
# Usage: make test-db-up   (starts)
#        make test-db-down (stops + removes data)
#        make test         (runs go tests against it)
#
# Port 5433 avoids conflict with docker-compose.yml's app DB (port 5432).
# Both can run simultaneously.

name: model-hotel-test
services:
    test-db:
        image: postgres:16-alpine
        # Survive host reboots so the local test DB is always up (it still has no
        # persistent volume, so data stays ephemeral; only the container restarts).
        restart: unless-stopped
        environment:
            POSTGRES_USER: modelhotel
            POSTGRES_PASSWORD: changeme
            POSTGRES_DB: testdb
        # Tuned for throwaway data, which is the only kind this server ever holds:
        # there is no volume, every package DROPs and CREATEs its database on
        # startup, and a crash means rerunning the tests. Durability is therefore
        # pure cost. fsync/synchronous_commit/full_page_writes off is what makes a
        # test suite that is almost entirely small write transactions stop waiting
        # on the disk, and it is the difference between shards scaling and shards
        # queueing behind each other's WAL flushes.
        #
        # NEVER copy this block to docker-compose.yml. On real data, fsync=off
        # means an unclean shutdown can leave the cluster unrecoverably corrupt.
        #
        # max_connections: sharded runs (scripts/go-test-sharded) put several `go
        # test` processes here at once, each holding a pool of up to 25, on top of
        # the packages that already run concurrently. The stock 100 binds long
        # before CPU does, and a refused connection surfaces as a baffling test
        # failure rather than as backpressure.
        command:
            - postgres
            - "-c"
            - "max_connections=400"
            - "-c"
            - "shared_buffers=512MB"
            - "-c"
            - "fsync=off"
            - "-c"
            - "synchronous_commit=off"
            - "-c"
            - "full_page_writes=off"
            - "-c"
            - "max_wal_size=4GB"
            - "-c"
            - "checkpoint_timeout=30min"
        ports:
            - "5433:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U modelhotel -d testdb"]
            interval: 2s
            timeout: 2s
            retries: 10
