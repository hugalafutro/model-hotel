# Marks web/ as its own pnpm workspace root. Without this, pnpm walks up the
# directory tree looking for a workspace and can adopt one outside the repo
# (e.g. a stray ~/pnpm-workspace.yaml), linking node_modules to it.
packages: []

# Supply-chain cooldown: refuse dependency versions published less than 24h
# (1440 min) ago, so a compromised-then-yanked release can't be pulled in during
# the window maintainers typically catch and unpublish it. Gates fresh resolution
# (install/update/add) AND every --frozen-lockfile install: since pnpm 11.3 a
# verification pass re-applies this and trustPolicy to each lockfile entry, so a
# lockfile committed under a weaker policy fails CI too (verified on pnpm 12.11:
# a 10-year window makes `pnpm install --frozen-lockfile` fail). pnpm 11+ makes
# 1440 the default; kept explicit so the policy reads here.
minimumReleaseAge: 1440

# Refuse a version whose supply-chain trust rank is lower than the ranks already
# seen for that package (trusted-publisher > provenance attestation > neither).
# That drop is the signature of a stolen maintainer token publishing outside the
# package's normal CI: the release still looks like a routine bump, but arrives
# without the attestation every prior release carried. Like the cooldown above it
# is re-applied to every lockfile entry on each install, frozen included.
# Verified against the pinned pnpm 12.11 (packageManager in package.json).
trustPolicy: no-downgrade

# Enforce that trust check only on releases younger than 90 days (129600 min).
# The check is by publish date, not semver, so unscoped it also condemns the
# pre-provenance long tail: a from-scratch resolve fails on semver@6.3.1 (2023,
# transitive under @babel/core) purely because a later-published sibling carries
# an attestation it predates. That is archaeology, not an incident. A real
# takeover ships a *new* version, which is exactly what this window still
# covers, and minimumReleaseAge above already holds the first 24h of it.
trustPolicyIgnoreAfter: 129600

# Refuse subdependencies resolved from git refs or bare tarball URLs (registry,
# local paths, workspace links and the node/bun/deno GitHub repositories stay
# allowed). Direct dependencies here are all registry packages, so an exotic spec
# appearing at depth > 0 means some transitive maintainer started pulling code
# from a URL nobody in this repo reviewed. Checked when a subdependency is
# resolved; pnpm 11+ makes it the default, kept explicit so the policy reads
# here. Verified against the pinned pnpm 12.11.
blockExoticSubdeps: true

# Force the transitive @babel/core (pulled in by eslint-plugin-react-hooks,
# build/lint-time only) to a patched release. Fixes Dependabot advisory
# GHSA-4x5r-pxfx-6jf8; 7.29.0 is the vulnerable pin. Remove once a direct
# dependency requires >=7.29.6 on its own.
overrides:
  "@babel/core": "^7.29.6"
  # Force the transitive katex that rehype-katex 7.0.1 still declares as ^0.16
  # onto the app's own 0.19 line (one copy, renderToString API unchanged). Fixes
  # the Dependabot advisory for prototype pollution in katex < 0.18.2. Remove
  # once rehype-katex requires >=0.18.2 on its own.
  katex: "^0.19.0"

# Do not let pnpm self-switch to the packageManager version or record it in the
# lockfile. pnpm 12 otherwise writes a two-document pnpm-lock.yaml (its own
# @pnpm/exe.* binaries first), and GitHub's dependency graph reads only the first
# document: the web packages vanish from the SBOM and npm security alerts go
# silent (dependabot/dependabot-core#15904, open). With `ignore` the lockfile
# stays single-document, so the exact pnpm version is pinned where pnpm is
# installed instead: both Dockerfiles, .github/workflows/ci.yml and
# scripts/pre-push say 12.11.2. Drop this once the dependency graph parses the
# env document.
pmOnFail: ignore
