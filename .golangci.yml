version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Added per code review (Point 19):
    - gosec        # Security issues (hardcoded credentials, SQL injection, weak crypto)
    - gocritic     # Style and performance checks (unchecked range values, sloppy realloc)
    - revive       # Drop-in golint replacement with extra rules
    - gocyclo      # Cyclomatic complexity (prod code only; tests + generated migrations excluded below)
    - funlen       # Function length (prod code only; tests excluded below)
    - errorlint    # Proper error wrapping/inspection (errors.Is, errors.As)
    - nilerr       # Checks for returning nil even if err != nil
    - bodyclose    # HTTP response body must be closed
    - forbidigo    # Ban t.Skip: tests must pass or fail (see settings below)
    - nolintlint   # Every //nolint must name a linter, carry a reason, and actually suppress something

  settings:
    errcheck:
      check-type-assertions: false

    nolintlint:
      # A directive that suppresses nothing is dead weight: either the linter
      # is not enabled or the config already excludes it for that path.
      allow-unused: false
      require-explanation: true
      require-specific: true

    forbidigo:
      # The test database and every required tool (pg_dump, pg_restore, docker)
      # are always present in CI and locally, so a skipped test is a silently
      # unfixed test, not a graceful degradation. Ban t.Skip/t.Skipf outright:
      # fix the test (seed the fixture, assert the real outcome) instead.
      forbid:
        - pattern: '\.Skipf?$'
          msg: "test skips are banned: tests must pass or fail. Fix the test (seed fixtures / assert the real outcome) instead of skipping."
      analyze-types: false

    gocyclo:
      # Ceiling for prod code (tests + generated migrations excluded below).
      # 30 is the current ratchet, met with zero inline nolints (worst prod
      # function is currently 29); lower this as further refactors land.
      min-complexity: 30

    funlen:
      # Length ceiling for prod functions, counted in lines only: statements: -1
      # disables the second dimension so one long switch does not read as two
      # violations. Comments do not count toward the limit, so documenting a
      # function never pushes it over. 200 is the current ratchet: the one prod
      # function still above it, cmd/server's main at 298 lines, is excluded by
      # name below. Lower this as further refactors land.
      lines: 200
      statements: -1
      ignore-comments: true

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

    gosec:
      excludes:
        - G101 # Hardcoded credentials (many false positives on config keys)
        - G404 # Weak random (InsecureRandRead — we only use crypto/rand)

  exclusions:
    rules:
      # Test files: errcheck noise from defer os.RemoveAll, w.Write in httptest, etc.
      # Also exclude gosec G104 (unhandled errors) in test files - os.Setenv, json.Decode, etc.
      # The size linters (gocyclo, funlen) are prod-only too: a table-driven test
      # is one long function by design, and its size is capped by the file-size
      # gate in scripts/ci/size-gate.sh instead.
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
          - gosec
          - gocyclo
          - funlen

      # SA5011 (possible nil deref) is noise in tests: constructors that never
      # return nil are routinely nil-checked then used, and values guarded by a
      # preceding t.Fatal(f) are safe (staticcheck doesn't always model the
      # terminating call). Scoped to test files so SA5011 stays active in prod.
      - path: _test\.go
        linters:
          - staticcheck
        text: "SA5011"

      # Front Desk reaches admin-configured member instances (an internal HA
      # fleet) through the guarded probe client (netguard.go): a dial-time block
      # on unspecified/link-local/cloud-metadata IPs - post-resolution, so DNS
      # rebinding is caught too - plus cross-host redirect refusal. gosec's SSRF
      # taint analysis (G704) can't see that mitigation, so the member-URL
      # request in memberapi.go is a false positive. Scoped to this file only so
      # SSRF detection stays active everywhere else (e.g. the proxy/provider path).
      - path: internal/frontdesk/memberapi\.go
        linters:
          - gosec
        text: "G704"

      # The recover() return value is intentionally discarded in panic-safety guards
      - linters:
          - errcheck
        source: "defer func\\(\\) \\{ recover\\(\\) \\}\\(\\)"

      # Generated migration files have long functions
      - path: internal/db/migrations/
        linters:
          - gocyclo

      # The one prod function still above the funlen ratchet: cmd/server's main
      # is a linear wiring sequence (config, db, migrations, every repository and
      # service, routes, signal handling) where each step needs the ones before
      # it. Named explicitly rather than raising the limit, so it is the only
      # exception and it disappears the moment main is split.
      - path: cmd/server/main\.go
        linters:
          - funlen
        text: "Function 'main' is too long"

      # gocritic style/performance suggestions are advisory
      - linters:
          - gocritic
        text: "hugeParam|rangeValCopy|importShadow|unnamedResult|nestingReduce|sprintfQuotedString"

      # deferInLoop/exitAfterDefer stay active in prod code (they catch real
      # leaks) but are noise in tests: defer-per-iteration cleanup and
      # os.Exit in TestMain are deliberate patterns there.
      - path: _test\.go
        linters:
          - gocritic
        text: "deferInLoop|exitAfterDefer"

      # revive unused-parameter and package-comments are advisory
      - linters:
          - revive
        text: "unused-parameter|package-comments"

      # gosec's taint rules (G704 SSRF, G705 XSS, G118 context lifetime) are
      # not deterministic: the same tree reports a finding, nothing, or an
      # unused directive depending on analysis order between runs. A gosec
      # //nolint that is unused on one run still suppresses a real report on
      # the next, so nolintlint's unused check is waived for gosec. The
      # message carries no rule id, so the waiver covers every gosec rule:
      # a dead gosec directive for a deterministic rule goes unreported, the
      # price of a lint that never flaps. The explanation and specific-linter
      # requirements still apply. The text is a substring of nolintlint's
      # own wording (golangci-lint 2.13); re-check it after an upgrade.
      - linters:
          - nolintlint
        text: 'is unused for linter "gosec"'

formatters:
  enable:
    - gci

  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule