# Scrapes every Model Hotel member's /metrics. One scrape block per member,
# because the bearer token is per block: put each member's METRICS_TOKEN (or,
# until one is set, its admin token) in tokens/<member>, mode 0600. Every block
# relabels job to "model-hotel" and tags its member, so the dashboard's queries
# (job="model-hotel", legends by member) fit any fleet size unchanged. Members
# are scraped by their public name so the file works from any host; a
# Prometheus on the same Docker host as a member may target the container
# instead (model-hotel-app-1:8080 on the model-hotel_default network).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: mh1
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/tokens/mh1
    static_configs:
      - targets: ["model-hotel1.example.com"]
        labels:
          member: mh1
    relabel_configs:
      - target_label: job
        replacement: model-hotel
