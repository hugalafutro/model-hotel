name: hugalafutro/model-hotel-logs
description: "Parse Model Hotel and Front Desk security logs"
# Model Hotel emits three shapes of the same records, so the parser normalises
# all three before classifying anything:
#   * LOG_FORMAT=json (both binaries): one flat JSON object per line, with the
#     scope lifted out of the message into "source".
#   * Model Hotel text: "2006/01/02 15:04:05 level=WARNING scope: message k=v"
#   * Front Desk text (stdlib slog): 'time=... level=WARN msg="scope: message" k=v'
# The client address arrives under four different keys depending on the call
# site: remote_addr (auth lines), remote (access log), client_ip (proxy) and
# ip (the IP rate limiter).
filter: "evt.Parsed.program startsWith 'model-hotel' || evt.Parsed.program startsWith 'front-desk'"
pattern_syntax:
  MH_TIME: '%{YEAR}/%{MONTHNUM}/%{MONTHDAY} %{TIME}'
nodes:
  # JSON: unmarshal into evt.Unmarshaled.mh and rebuild "scope: message" so the
  # classification below can be written once for every format.
  - filter: 'TrimSpace(evt.Parsed.message) startsWith "{" && UnmarshalJSON(evt.Parsed.message, evt.Unmarshaled, "mh") in ["", nil]'
    statics:
      - parsed: mh_event
        expression: 'Sprintf("%v: %v", evt.Unmarshaled.mh.source ?? "", evt.Unmarshaled.mh.msg ?? "")'
      - parsed: mh_addr
        expression: >-
          Sprintf("%v", evt.Unmarshaled.mh.remote_addr ?? "") != "" ? Sprintf("%v", evt.Unmarshaled.mh.remote_addr) :
          Sprintf("%v", evt.Unmarshaled.mh.remote ?? "") != "" ? Sprintf("%v", evt.Unmarshaled.mh.remote) :
          Sprintf("%v", evt.Unmarshaled.mh.client_ip ?? "") != "" ? Sprintf("%v", evt.Unmarshaled.mh.client_ip) :
          Sprintf("%v", evt.Unmarshaled.mh.ip ?? "")
      - meta: log_format
        value: json
  # Text: the raw line already reads "scope: message", so it is its own
  # classification key. ParseKV lifts the trailing attributes.
  - filter: 'TrimSpace(evt.Parsed.message) not startsWith "{"'
    statics:
      - parsed: mh_event
        expression: evt.Parsed.message
      - meta: log_format
        value: text
  - filter: 'TrimSpace(evt.Parsed.message) not startsWith "{" && ParseKV(evt.Parsed.message, evt.Unmarshaled, "mh") in ["", nil]'
    statics:
      # Front Desk quotes the whole "scope: message" into msg=; preferring it
      # over the raw line keeps the classification off the attribute values.
      - parsed: mh_event
        expression: 'evt.Unmarshaled.mh.msg ?? evt.Parsed.message'
      - parsed: mh_addr
        expression: >-
          Sprintf("%v", evt.Unmarshaled.mh.remote_addr ?? "") != "" ? Sprintf("%v", evt.Unmarshaled.mh.remote_addr) :
          Sprintf("%v", evt.Unmarshaled.mh.remote ?? "") != "" ? Sprintf("%v", evt.Unmarshaled.mh.remote) :
          Sprintf("%v", evt.Unmarshaled.mh.client_ip ?? "") != "" ? Sprintf("%v", evt.Unmarshaled.mh.client_ip) :
          Sprintf("%v", evt.Unmarshaled.mh.ip ?? "")

  # Replay and forensic modes refuse an event with no evt.StrTime, so every
  # shape has to yield one. JSON and Front Desk text carry a `time` attribute;
  # a Model Hotel text line leads with one, in local time and with no zone,
  # which is why LOG_FORMAT=json is the better source when there is a choice.
  - filter: 'Sprintf("%v", evt.Unmarshaled.mh.time ?? "") != ""'
    statics:
      - target: evt.StrTime
        expression: 'Sprintf("%v", evt.Unmarshaled.mh.time)'
  - grok:
      pattern: '^%{MH_TIME:mh_time} level='
      apply_on: message
    statics:
      - target: evt.StrTime
        expression: evt.Parsed.mh_time

  # ---- classification -------------------------------------------------------

  # A request to /v1 with a missing, unknown or disabled virtual key.
  - filter: 'evt.Parsed.mh_event contains "auth: key not found" || evt.Parsed.mh_event contains "auth: missing authorization header" || evt.Parsed.mh_event contains "auth: key owner disabled"'
    statics:
      - meta: log_type
        value: model-hotel_auth_fail
      - meta: sub_type
        value: vk_invalid

  # A request to the admin API, the metrics endpoint or the restore endpoint
  # with a missing or wrong admin token.
  - filter: 'evt.Parsed.mh_event contains "auth: admin request with invalid token" || evt.Parsed.mh_event contains "auth: admin request missing bearer token" || evt.Parsed.mh_event contains "auth: metrics scrape with invalid token" || evt.Parsed.mh_event contains "auth: metrics scrape missing bearer token" || evt.Parsed.mh_event contains "auth: backup restore with invalid admin token" || evt.Parsed.mh_event contains "auth: backup restore with missing admin token" || evt.Parsed.mh_event contains "frontdesk: metrics scrape with invalid token" || evt.Parsed.mh_event contains "frontdesk: metrics scrape missing bearer token"'
    statics:
      - meta: log_type
        value: model-hotel_auth_fail
      - meta: sub_type
        value: admin_token

  # Dashboard login: wrong password, wrong TOTP code, or a failed admin-token
  # exchange behind the TOTP gate.
  - filter: 'evt.Parsed.mh_event contains "userlogin: login failed" || evt.Parsed.mh_event contains "userlogin: invalid TOTP code" || evt.Parsed.mh_event contains "totp: login failed"'
    statics:
      - meta: log_type
        value: model-hotel_auth_fail
      - meta: sub_type
        value: login

  # An SSO callback that did not complete (bad state, nonce mismatch, denied).
  - filter: 'evt.Parsed.mh_event contains "oidc: callback failed" || evt.Parsed.mh_event contains "github: callback failed"'
    statics:
      - meta: log_type
        value: model-hotel_auth_fail
      - meta: sub_type
        value: sso

  - filter: 'evt.Parsed.mh_event contains "auth: CSRF check failed"'
    statics:
      - meta: log_type
        value: model-hotel_auth_fail
      - meta: sub_type
        value: csrf

  # An authenticated user reaching for something their role does not cover.
  - filter: 'evt.Parsed.mh_event contains "auth: insufficient permissions"'
    statics:
      - meta: log_type
        value: model-hotel_auth_fail
      - meta: sub_type
        value: forbidden
      - meta: target_user
        expression: 'evt.Unmarshaled.mh.username ?? ""'

  # A restore attempt whose archive is not signed by this instance.
  - filter: 'evt.Parsed.mh_event contains "backup: restore rejected, signature mismatch"'
    statics:
      - meta: log_type
        value: model-hotel_auth_fail
      - meta: sub_type
        value: backup_signature

  # The application's own throttles. These are edge triggered: one line per
  # throttling episode, not one per rejected request.
  - filter: 'evt.Parsed.mh_event contains "ratelimit-ip: throttling started" || evt.Parsed.mh_event contains "userlogin: throttled" || evt.Parsed.mh_event contains "userlogin: account throttled" || evt.Parsed.mh_event contains "totp: login throttled" || evt.Parsed.mh_event contains "oidc: callback throttled" || evt.Parsed.mh_event contains "github: callback throttled"'
    statics:
      - meta: log_type
        value: model-hotel_throttled

  # The client address lands under a different key per call site, and builds
  # older than the clientip package (PR #674) log it with the TCP port still
  # attached, so the grok strips an optional port and any IPv6 brackets.
  - grok:
      pattern: '^\[?%{IP:mh_ip}\]?(:%{NUMBER})?$'
      expression: evt.Parsed.mh_addr

  # Only records this parser recognised are worth the rest of the pipeline.
  - filter: 'evt.Meta.log_type startsWith "model-hotel_"'
    onsuccess: next_stage
    statics:
      - meta: service
        value: model-hotel
statics:
  - meta: source_ip
    expression: evt.Parsed.mh_ip
  - meta: http_path
    expression: 'Sprintf("%v", evt.Unmarshaled.mh.path ?? "")'
