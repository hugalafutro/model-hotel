name: hugalafutro/model-hotel-logs
description: "Parse Model Hotel and Front Desk security logs"
# Model Hotel emits three shapes of the same records, so the parser normalises
# all three before classifying anything:
#   * LOG_FORMAT=json (both binaries): one flat JSON object per line, with the
#     scope lifted out of the message into "source".
#   * Model Hotel text: "2006/01/02 15:04:05 level=WARNING scope: message k=v"
#   * Front Desk text (stdlib slog): 'time=... level=WARN msg="scope: message" k=v'
#
# Two rules keep a caller from talking to this parser through a log line. A
# request path is caller-controlled and is logged as an attribute, so:
#   1. Classification reads mh_body, which is the scope and message ONLY, taken
#      from a position-anchored capture. Attribute values are never in it, and
#      every match is anchored at its start, so an injected copy of a message
#      further along the line cannot classify anything.
#   2. The address is read from the FIRST "key=value" token of an address name,
#      and only then validated as an IP. Taking the first and validating it,
#      rather than scanning for the first thing that looks like an IP, means a
#      line whose real address is unparseable yields nothing instead of falling
#      through to whatever a caller wrote further along.
# Both rules read the line as logfmt, where a value holding a space is quoted.
# A caller-controlled value therefore lives inside quotes, and rule 2's
# duplicate check deliberately looks only OUTSIDE them: a forged
# "remote_addr=" in a request path must not be able to suppress the record it
# appears in (that would let anyone evade a ban by appending one to their
# path), while two genuine attribute-level addresses, which no current call
# site emits, still fail closed.
#
# For a pipeline that must not be fooled at all, run the instance with
# LOG_FORMAT=json: the JSON branch below reads discrete fields, where none of
# this ambiguity exists.
filter: "evt.Parsed.program startsWith 'model-hotel' || evt.Parsed.program startsWith 'front-desk'"
pattern_syntax:
  MH_TIME: '%{YEAR}/%{MONTHNUM}/%{MONTHDAY} %{TIME}'
  # The client address lands under a different key per call site: remote_addr
  # (auth lines), remote (access log), client_ip (proxy) and ip (the IP rate
  # limiter). This captures the whole token; the IP itself is validated after.
  #
  # It reads mh_attrs, the attribute tail of the record, and skips over every
  # complete quoted value on the way, so the token it finds is always real
  # attribute text and never something a caller wrote inside a value. See the
  # mh_attrs captures below for how that tail is taken from each shape.
  #
  # The skip has to step OVER quoted values rather than stop at the first one:
  # a record may quote a value before it names the address ("oidc: callback
  # failed reason=\"nonce mismatch\" remote_addr=..."), and stopping early
  # would silently drop its source_ip.
  MH_ADDR: '^(?:[^"]|"(?:[^"\\]|\\.)*")*?(?:^|[ ])(remote_addr|remote|client_ip|ip)=%{NOTSPACE:mh_rawaddr}(?: |$)'
nodes:
  # ---- normalise ------------------------------------------------------------

  # JSON: every field is already discrete, so nothing here can be spoofed by a
  # value. Rebuild "scope: message" so classification is written once.
  - filter: 'TrimSpace(evt.Parsed.message) startsWith "{" && UnmarshalJSON(evt.Parsed.message, evt.Unmarshaled, "mh") in ["", nil]'
    statics:
      - parsed: mh_body
        expression: 'Sprintf("%v: %v", evt.Unmarshaled.mh.source ?? "", evt.Unmarshaled.mh.msg ?? "")'
      - parsed: mh_rawaddr
        expression: >-
          Sprintf("%v", evt.Unmarshaled.mh.remote_addr ?? "") != "" ? Sprintf("%v", evt.Unmarshaled.mh.remote_addr) :
          Sprintf("%v", evt.Unmarshaled.mh.remote ?? "") != "" ? Sprintf("%v", evt.Unmarshaled.mh.remote) :
          Sprintf("%v", evt.Unmarshaled.mh.client_ip ?? "") != "" ? Sprintf("%v", evt.Unmarshaled.mh.client_ip) :
          Sprintf("%v", evt.Unmarshaled.mh.ip ?? "")
      - meta: log_format
        value: json
      - target: evt.StrTime
        expression: 'Sprintf("%v", evt.Unmarshaled.mh.time ?? "")'

  # Model Hotel text: the message runs from just after "level=<LEVEL> " to the
  # end of the line. Attributes are in it, but only ever after the message, and
  # classification anchors at the start.
  #
  # mh_attrs is the whole line here: this shape writes its message unquoted, so
  # every quote on the line opens a quoted VALUE, which the address rules skip
  # over. The gateway's own messages are fixed strings, so nothing a caller
  # writes reaches the unquoted text those rules read.
  - grok:
      pattern: '^%{MH_TIME:mh_time} level=%{WORD:mh_level} %{GREEDYDATA:mh_body}$'
      apply_on: message
    statics:
      - parsed: mh_attrs
        expression: evt.Parsed.message
      - meta: log_format
        value: text
      # Local time with no zone, so dateparse-enrich reads it as UTC. On a
      # container with a non-UTC TZ, alert times are off by the offset;
      # LOG_FORMAT=json carries a real timestamp and does not have this problem.
      - target: evt.StrTime
        expression: evt.Parsed.mh_time

  # Front Desk text (stdlib slog) quotes the whole "scope: message" into msg=,
  # so the message is already delimited for us.
  #
  # mh_attrs is what follows that quoted message, and taking it is load
  # bearing rather than cosmetic. Front Desk interpolates caller-chosen text
  # into a message (a fleet member's name reaches
  # "frontdesk: <name> is unreachable ..."), so the message itself can hold a
  # forged "remote_addr=" token. Cutting the attribute tail at the closing
  # quote puts every such token out of reach of the address rules, and the
  # (?:[^"\\]|\\.)* form walks the quoted message the way slog wrote it, so a
  # quote inside the name cannot end it early and expose the rest.
  - grok:
      pattern: '^time=%{NOTSPACE:fd_time} level=%{WORD:mh_level} msg="%{DATA:mh_body}"'
      apply_on: message
    statics:
      - meta: log_format
        value: text
      - target: evt.StrTime
        expression: evt.Parsed.fd_time

  # ---- classification -------------------------------------------------------
  # Anchored at the start of the message. Never `contains`, or a caller could
  # put any of these strings in a request path and pick their own log_type.

  # A request to /v1 with a missing, unknown or disabled virtual key.
  - filter: 'evt.Parsed.mh_body startsWith "auth: key not found" || evt.Parsed.mh_body startsWith "auth: missing authorization header" || evt.Parsed.mh_body startsWith "auth: key owner disabled"'
    statics:
      - meta: log_type
        value: model-hotel_auth_fail
      - meta: sub_type
        value: vk_invalid

  # A request to the admin API, the metrics endpoint, the restore endpoint or
  # Front Desk's Traefik config endpoint with a missing or wrong token. The two
  # "auth: admin request …" messages come from both binaries: the gateway's
  # admin middleware and the shared admin-or-session gate that fronts Front
  # Desk's whole control plane. Three of the pairs after them are the shared
  # bearer gate (adminauth.BearerTokenGate) under its three subjects: the
  # gateway's metrics scrape, Front Desk's metrics scrape and Front Desk's
  # Traefik config poll. Each subject keeps its own wording, so a new gate means
  # a new pair here. The backup restore pair is not that gate; it is the restore
  # endpoint checking the admin token itself (internal/api/backup_restore.go).
  - filter: 'evt.Parsed.mh_body startsWith "auth: admin request with invalid token" || evt.Parsed.mh_body startsWith "auth: admin request missing bearer token" || evt.Parsed.mh_body startsWith "auth: metrics scrape with invalid token" || evt.Parsed.mh_body startsWith "auth: metrics scrape missing bearer token" || evt.Parsed.mh_body startsWith "auth: backup restore with invalid admin token" || evt.Parsed.mh_body startsWith "auth: backup restore with missing admin token" || evt.Parsed.mh_body startsWith "frontdesk: metrics scrape with invalid token" || evt.Parsed.mh_body startsWith "frontdesk: metrics scrape missing bearer token" || evt.Parsed.mh_body startsWith "frontdesk: traefik config poll with invalid token" || evt.Parsed.mh_body startsWith "frontdesk: traefik config poll missing bearer token"'
    statics:
      - meta: log_type
        value: model-hotel_auth_fail
      - meta: sub_type
        value: admin_token

  # Dashboard login: wrong password, wrong TOTP code, a failed admin-token
  # exchange behind the TOTP gate, or a passkey assertion that did not verify.
  # The passkey endpoint is unauthenticated on both binaries, so a rejected
  # assertion is an anonymous caller failing a login like any other.
  - filter: 'evt.Parsed.mh_body startsWith "userlogin: login failed" || evt.Parsed.mh_body startsWith "userlogin: invalid TOTP code" || evt.Parsed.mh_body startsWith "totp: login failed" || evt.Parsed.mh_body startsWith "webauthn: passkey login failed"'
    statics:
      - meta: log_type
        value: model-hotel_auth_fail
      - meta: sub_type
        value: login

  # An SSO callback that did not complete (bad state, nonce mismatch, denied).
  - filter: 'evt.Parsed.mh_body startsWith "oidc: callback failed" || evt.Parsed.mh_body startsWith "github: callback failed"'
    statics:
      - meta: log_type
        value: model-hotel_auth_fail
      - meta: sub_type
        value: sso

  - filter: 'evt.Parsed.mh_body startsWith "auth: CSRF check failed"'
    statics:
      - meta: log_type
        value: model-hotel_auth_fail
      - meta: sub_type
        value: csrf

  # An authenticated user reaching for something their role does not cover.
  - filter: 'evt.Parsed.mh_body startsWith "auth: insufficient permissions"'
    statics:
      - meta: log_type
        value: model-hotel_auth_fail
      - meta: sub_type
        value: forbidden

  # A restore attempt whose archive is not signed by this instance.
  - filter: 'evt.Parsed.mh_body startsWith "backup: restore rejected, signature mismatch"'
    statics:
      - meta: log_type
        value: model-hotel_auth_fail
      - meta: sub_type
        value: backup_signature

  # The application's own throttles. These are edge triggered: one line per
  # throttling episode, not one per rejected request.
  - filter: 'evt.Parsed.mh_body startsWith "ratelimit-ip: throttling started" || evt.Parsed.mh_body startsWith "userlogin: throttled" || evt.Parsed.mh_body startsWith "userlogin: account throttled" || evt.Parsed.mh_body startsWith "totp: login throttled" || evt.Parsed.mh_body startsWith "oidc: callback throttled" || evt.Parsed.mh_body startsWith "github: callback throttled"'
    statics:
      - meta: log_type
        value: model-hotel_throttled

  # ---- address and context --------------------------------------------------

  # Front Desk text: the attribute tail, everything after the quoted message.
  - grok:
      pattern: '^time=%{NOTSPACE} level=%{WORD} msg="(?:[^"\\]|\\.)*" %{GREEDYDATA:mh_attrs}$'
      apply_on: message

  # Text: the first address-named token of the attribute tail, whatever it
  # holds. MH_ADDR skips over every quoted value in that tail, so a value
  # cannot supply one however it is ordered.
  - grok:
      pattern: '%{MH_ADDR}'
      apply_on: mh_attrs

  # A genuine record names the address exactly once; none of the call sites
  # that log one names it twice. A second occurrence outside every quoted
  # value therefore means something wrote a "key=value" pair where an
  # attribute belongs, so the address cannot be trusted and the event is left
  # without a source_ip, which keeps it out of every scenario (they all
  # require one).
  #
  # Both halves skip over quoted values the same way MH_ADDR does, so a forged
  # address inside a quoted value does NOT trip this. That is the difference
  # between a caller poisoning the record (impossible: an address token is
  # only ever read from real attribute text) and a caller suppressing it
  # (which this must not allow, or appending "remote_addr=" to a request path
  # would be a way to never get banned).
  - grok:
      pattern: '^(?:[^"]|"(?:[^"\\]|\\.)*")*?(?:^|[ ])(remote_addr|remote|client_ip|ip)=%{NOTSPACE} (?:[^"]|"(?:[^"\\]|\\.)*")*?[ ](remote_addr|remote|client_ip|ip)=%{NOTSPACE:mh_dupaddr}'
      apply_on: mh_attrs

  # Both shapes end here. Only now is the candidate required to be an address,
  # so a malformed one drops the event rather than promoting the next thing on
  # the line that happens to parse. Builds older than the clientip package
  # (PR #674) still carry the TCP port, so a port and IPv6 brackets are shed.
  - grok:
      pattern: '^\[?%{IP:mh_ip}\]?(:%{NUMBER})?$'
      expression: evt.Parsed.mh_rawaddr

  # Request path, for alert context only. Bare first, then quoted, so a quoted
  # path (one holding a space) wins over the truncated bare read of itself.
  - grok:
      pattern: '(^| )path=%{NOTSPACE:mh_path}'
      apply_on: message
  - grok:
      pattern: '(^| )path="%{DATA:mh_path}"'
      apply_on: message

  # The role a rejected request was made under, for alert context. Same
  # bare-then-quoted pair as the path, since usernames may hold a space.
  - grok:
      pattern: '(^| )username=%{NOTSPACE:mh_user}'
      apply_on: message
  - grok:
      pattern: '(^| )username="%{DATA:mh_user}"'
      apply_on: message

  # Only records this parser recognised are worth the rest of the pipeline.
  - filter: 'evt.Meta.log_type startsWith "model-hotel_"'
    onsuccess: next_stage
    statics:
      - meta: service
        value: model-hotel
statics:
  - meta: source_ip
    expression: 'evt.Parsed.mh_dupaddr == "" ? evt.Parsed.mh_ip : ""'
  - meta: http_path
    expression: 'evt.Parsed.mh_path != "" ? evt.Parsed.mh_path : Sprintf("%v", ("mh" in evt.Unmarshaled) ? (evt.Unmarshaled.mh.path ?? "") : "")'
  # A static computing to "" is skipped, so this lands only where there is one.
  - meta: target_user
    expression: 'evt.Parsed.mh_user != "" ? evt.Parsed.mh_user : Sprintf("%v", ("mh" in evt.Unmarshaled) ? (evt.Unmarshaled.mh.username ?? "") : "")'
