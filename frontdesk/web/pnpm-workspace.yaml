# Marks frontdesk/web/ as its own pnpm workspace root, separate from web/.
# Without this, pnpm walks up the directory tree looking for a workspace and can
# adopt one outside the repo (e.g. a stray ~/pnpm-workspace.yaml), linking
# node_modules to it. The Front Desk UI is intentionally not part of the main
# web/ workspace (see plans/ha-frontdesk.md).
packages: []

# Supply-chain cooldown mirrored from web/pnpm-workspace.yaml: refuse dependency
# versions published < 24h (1440 min) ago. Gates fresh resolution AND every
# --frozen-lockfile install (pnpm 11.3+ re-applies it to each lockfile entry).
minimumReleaseAge: 1440

# Supply-chain trust gates mirrored from web/pnpm-workspace.yaml (see there for
# the rationale): reject a version that drops supply-chain trust rank relative to
# the package's own history (the fingerprint of a stolen maintainer token), and
# reject subdependencies resolved from git refs, tarball URLs or local paths
# instead of a registry. The trust check is re-applied to every lockfile entry on
# each install, frozen included. Verified against the pinned pnpm 12.11.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 129600
blockExoticSubdeps: true

# Transitive build/lint-time dep pins mirrored from web/pnpm-workspace.yaml so
# the same Dependabot advisories stay closed here. Remove each once a direct
# dependency requires the patched range on its own.
overrides:
  "@babel/core": "^7.29.6"
