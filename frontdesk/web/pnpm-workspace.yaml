# Marks frontdesk/web/ as its own pnpm workspace root, separate from web/.
# Without this, pnpm walks up the directory tree looking for a workspace and can
# adopt one outside the repo (e.g. a stray ~/pnpm-workspace.yaml), linking
# node_modules to it. The Front Desk UI is intentionally not part of the main
# web/ workspace (see plans/ha-frontdesk.md).
packages: []

# Supply-chain cooldown mirrored from web/pnpm-workspace.yaml: refuse dependency
# versions published < 24h (1440 min) ago. Gates fresh resolution AND every
# --frozen-lockfile install (pnpm 11.3+ re-applies it to each lockfile entry).
minimumReleaseAge: 1440

# Supply-chain trust gates mirrored from web/pnpm-workspace.yaml (see there for
# the rationale). trustPolicy rejects a version that drops supply-chain trust
# rank relative to the package's own history (the fingerprint of a stolen
# maintainer token); it is re-applied to every lockfile entry on each install,
# frozen included. blockExoticSubdeps rejects subdependencies resolved from git
# refs or bare tarball URLs when they are resolved (registry, local paths,
# workspace links and the node/bun/deno GitHub repositories stay allowed).
# Verified against the pinned pnpm 12.11.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 129600
blockExoticSubdeps: true

# Transitive build/lint-time dep pins mirrored from web/pnpm-workspace.yaml so
# the same Dependabot advisories stay closed here. Remove each once a direct
# dependency requires the patched range on its own.
overrides:
  "@babel/core": "^7.29.6"

# Do not let pnpm self-switch to the packageManager version or record it in the
# lockfile. pnpm 12 otherwise writes a two-document pnpm-lock.yaml (its own
# @pnpm/exe.* binaries first), and GitHub's dependency graph reads only the first
# document: the web packages vanish from the SBOM and npm security alerts go
# silent (dependabot/dependabot-core#15904, open). With `ignore` the lockfile
# stays single-document, so the exact pnpm version is pinned where pnpm is
# installed instead: both Dockerfiles, .github/workflows/ci.yml and
# scripts/pre-push say 12.11.2. Drop this once the dependency graph parses the
# env document.
pmOnFail: ignore
