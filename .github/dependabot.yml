version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      npm-deps:
        patterns: ["*"]
    ignore:
      # jsdom 30.1.x broke multipart `request.text()` (the restore tests in
      # web/src/pages/Settings/__tests__/DatabaseBackupSettings.test.tsx read the
      # uploaded body that way), so package.json pins 30.0.1. Lift this once a
      # release fixes it.
      - dependency-name: "jsdom"
        versions: [">=30.1.0"]

  # Front Desk's UI is its own pnpm workspace root, so it needs its own entry;
  # the /web one does not reach it.
  - package-ecosystem: "npm"
    directory: "/frontdesk/web"
    schedule:
      interval: "weekly"
    groups:
      frontdesk-npm-deps:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
