version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      npm-deps:
        patterns: ["*"]

  # Front Desk's UI is its own pnpm workspace root, so it needs its own entry;
  # the /web one does not reach it.
  - package-ecosystem: "npm"
    directory: "/frontdesk/web"
    schedule:
      interval: "weekly"
    groups:
      frontdesk-npm-deps:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
