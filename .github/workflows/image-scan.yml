# Daily vulnerability scan of the published images (app + Front Desk).
#
# The CI gate only runs when a PR is open, but CVEs land in already-published
# images (this is exactly how the OpenSSL 3.5.6 flags appeared on the published
# image: no code changed, the world did). A failed run here means a rebuild/release
# would fix something — the docker-publish workflow's apk upgrade pulls current
# Alpine patches — so it doubles as the signal to cut a patch release. It also
# catches the publish workflow's GHA layer cache serving a stale apk upgrade
# layer.
#
# Every step below is independent on purpose. This job is the only thing that
# uploads Trivy SARIF, so one image being briefly unreachable must never cost
# us the other image's report or gate: each step records its own outcome, and
# the summary at the end fails the job while naming what actually broke. A red
# run whose cause you have to go dig for is how this workflow already lost a
# week of scan coverage to a transient registry timeout.
#
# The scan pulls from GHCR: every publish path (release, :dev, and the refresh
# job below) pushes the same digest to GHCR and Docker Hub, so scanning one
# registry covers both, and GHCR is the one our own stacks pull from. It scans
# :latest specifically, which is why a release is the only publish wired to the
# workflow_run trigger: ci.yml publishes :dev, and :dev does not move :latest,
# so a plain merge still has nothing here to react to.
#
# Findings come in two tiers. Fixable CRITICAL/HIGH decides red or green, as it
# always has. Below that sits everything else fixable, which for a long time was
# uploaded to the Security tab and then read by nobody: Alpine ships advisories
# with no severity, Trivy reports them UNKNOWN, GitHub files them as `note`, and
# `note` is under every threshold here. 27 fixable PostgreSQL client CVEs sat on
# the published image that way behind a series of green runs. The lower tier now
# triggers the same rebuild and reaches the same tracking issue; it just never
# turns anything red.
name: Scan Published Image

# Serialise runs. With a weekly cron and manual dispatch, overlap was hard to
# arrange; a daily cron plus a per-release trigger makes it routine, and two
# refresh jobs rebuilding and pushing :latest at once would race to decide which
# digest wins. Queue rather than cancel: a cancelled run can drop a SARIF upload
# or interrupt a push, and the two-dispatch trick for closing alerts in one
# sitting still works, just one after the other.
concurrency:
  group: image-scan
  cancel-in-progress: false

on:
  # Detection runs daily, the below-gate auto-fix stays weekly, and the two crons
  # exist so a run can tell which it is (github.event.schedule).
  #
  # Detection wants to be daily: a fixable finding lands when the distro ships the
  # patch, which has no relationship to when we build. The 28 fixable PostgreSQL
  # client CVEs that reached :latest on 2026-08-18 were unfixed at build time and
  # became fixable days later, so nothing but this workflow could notice, and the
  # cron interval IS the detection latency. A clean day costs one pull, one scan.
  #
  # The rebuild does NOT want to be daily. It republishes :latest on the
  # CRITICAL/HIGH rescan alone, deliberately (see the publish step), so a fixable
  # below-gate finding that a rebuild cannot shift — a go.mod CVE, say — makes
  # every run rebuild, change nothing, and push a fresh :latest digest anyway.
  # Weekly that is one wasted digest; daily it is one every day until a human
  # lands a code fix. The below-gate tier keeps the cadence it already had.
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC: detect, and auto-fix below-gate findings
    - cron: '17 6 * * 0,2-6' # other days 06:17 UTC: detect and report only
  # A release moves :latest, so scan the thing that was just published instead of
  # waiting up to a day for the cron. This covers the other half of the same gap:
  # the cron catches the world changing under a static image, this catches the
  # image changing. Only "Publish Docker Image" is listed because it is the only
  # workflow that moves :latest — ci.yml publishes :dev, which this never scans,
  # and the refresh job below republishes :latest directly rather than through the
  # publish workflow, so neither can loop back into here.
  workflow_run:
    workflows: ['Publish Docker Image']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  # packages read: the scan pulls from GHCR with GITHUB_TOKEN so it keeps
  # working if a package is ever made private.
  packages: read

env:
  APP_IMAGE: ghcr.io/${{ github.repository }}:latest
  FRONTDESK_IMAGE: ghcr.io/${{ github.repository }}-frontdesk:latest

jobs:
  scan:
    name: Trivy Scan (latest)
    # A failed publish leaves :latest where it was, so scanning on that event
    # reports the picture the previous run already reported. The first clause
    # carries the cron and dispatch runs, where there is no workflow_run context
    # and the conclusion would be empty.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      app_gate: ${{ steps.gate_app.outcome }}
      frontdesk_gate: ${{ steps.gate_frontdesk.outcome }}
      app_advisory: ${{ steps.advisory_app.outcome }}
      frontdesk_advisory: ${{ steps.advisory_frontdesk.outcome }}
      app_sarif: ${{ steps.upload_app.outputs.sarif-id }}
      frontdesk_sarif: ${{ steps.upload_frontdesk.outputs.sarif-id }}
      postgres_line: ${{ steps.postgres_summary.outputs.line }}
      # Defined once here and read by both the refresh job's `if` and its matrix,
      # which have to agree: the job gate can let the job start for one image
      # while a matrix leg still decides to rebuild the other. Every trigger that
      # is not the detect-only cron may auto-fix, so a manual dispatch still
      # rebuilds on demand.
      autofix: ${{ github.event.schedule != '17 6 * * 0,2-6' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # We pull rather than letting Trivy fetch from the registry so a single
      # registry blip (`dial tcp ...: i/o timeout`) gets retried instead of
      # killing the run. Trivy resolves an image from the local docker daemon
      # before the registry, so each scan reuses the pull above it.
      - name: Pull published image (with retries)
        id: pull_app
        continue-on-error: true
        run: scripts/ci/pull-image-with-retries.sh "$APP_IMAGE"

      # Full-picture report (all severities, unfixed included) for the GitHub
      # Security tab, so findings are tracked over time — deliberately broader
      # than the gate below, which only fails on what is actionable.
      - name: Scan published image (SARIF report)
        id: scan_app
        if: steps.pull_app.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.APP_IMAGE }}
          format: sarif
          output: trivy-image.sarif
          # Well above Trivy's 5m default: the image is already local, but the
          # vulnerability DB download still goes over the network.
          timeout: 15m

      - name: Upload SARIF to GitHub Security tab
        id: upload_app
        if: steps.scan_app.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-image.sarif
          category: published-image

      # The Front Desk control plane is published from the same release, so it
      # ages the same way and deserves the same weekly look. A distinct SARIF
      # category keeps its findings from overwriting the app image's.
      - name: Pull published Front Desk image (with retries)
        id: pull_frontdesk
        continue-on-error: true
        run: scripts/ci/pull-image-with-retries.sh "$FRONTDESK_IMAGE"

      - name: Scan published Front Desk image (SARIF report)
        id: scan_frontdesk
        if: steps.pull_frontdesk.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.FRONTDESK_IMAGE }}
          format: sarif
          output: trivy-frontdesk-image.sarif
          timeout: 15m

      - name: Upload Front Desk SARIF to GitHub Security tab
        id: upload_frontdesk
        if: steps.scan_frontdesk.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-frontdesk-image.sarif
          category: published-frontdesk-image

      # The database is the one part of the stack we ship a compose file for but
      # do not build, and it is where a PostgreSQL CVE actually lands: our images
      # carry only the client, so a server-side finding cannot fire in them and
      # would go unlooked-at entirely. Read the tag out of the compose file
      # rather than repeating it here, so the scan cannot drift from what the
      # stack actually runs.
      - name: Resolve the stack's PostgreSQL image
        id: postgres_image
        run: |
          set -euo pipefail
          image=$(sed -n 's/^[[:space:]]*image:[[:space:]]*\(postgres:[^[:space:]]*\).*/\1/p' docker-compose.yml | head -1)
          if [ -z "$image" ]; then
            echo "::error::no postgres image found in docker-compose.yml"
            exit 1
          fi
          echo "image=$image" >>"$GITHUB_OUTPUT"
          echo "Scanning $image"

      - name: Pull the PostgreSQL image (with retries)
        id: pull_postgres
        continue-on-error: true
        run: scripts/ci/pull-image-with-retries.sh "${{ steps.postgres_image.outputs.image }}"

      - name: Scan the PostgreSQL image
        id: scan_postgres
        if: steps.pull_postgres.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.postgres_image.outputs.image }}
          format: json
          output: trivy-postgres-image.json
          ignore-unfixed: true
          timeout: 15m

      # Deliberately NOT uploaded to the Security tab. This image is not ours to
      # fix, and its bundled Go helper binaries carry dozens of stdlib CVEs that
      # no action in this repo can clear — filing those as alerts would bury the
      # findings that are actionable under a permanent pile that is not, which is
      # the failure this whole change exists to undo. A counted one-line summary
      # says the same thing without costing anyone a triage pass.
      - name: Summarise the PostgreSQL findings
        id: postgres_summary
        if: steps.scan_postgres.outcome == 'success'
        continue-on-error: true
        env:
          IMAGE: ${{ steps.postgres_image.outputs.image }}
        run: |
          set -euo pipefail
          line=$(jq -r --arg img "$IMAGE" '
            [.Results[]?.Vulnerabilities[]?] as $v
            | if ($v | length) == 0 then
                "`\($img)`: no fixable vulnerabilities."
              else
                "`\($img)`: \($v | length) fixable findings ("
                + ($v | group_by(.PkgName) | sort_by(-length) | .[0:3]
                   | map("\(.[0].PkgName) \(length)") | join(", "))
                + ")."
              end' trivy-postgres-image.json)
          echo "$line"
          echo "line=$line" >>"$GITHUB_OUTPUT"
          {
            echo "### The stack's database image"
            echo
            echo "$line"
          } >>"$GITHUB_STEP_SUMMARY"

      # Gates run after both uploads, so a gate failure never costs us the
      # Security tab record of why it failed, and each gate is tied only to its
      # own image's pull: an unreachable Front Desk image must not let an
      # actionable app-image vulnerability through unremarked.
      #
      # Same actionable-only policy as the CI gate: fixable HIGH/CRITICAL only.
      - name: Scan published image for fixable HIGH/CRITICAL vulnerabilities
        id: gate_app
        if: steps.pull_app.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.APP_IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          timeout: 15m

      - name: Scan published Front Desk image for fixable HIGH/CRITICAL vulnerabilities
        id: gate_frontdesk
        if: steps.pull_frontdesk.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.FRONTDESK_IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          timeout: 15m

      # A second, softer tier: fixable at ANY severity. It exists because
      # severity alone turned out to be a bad proxy for "worth doing". Alpine's
      # security DB assigns no severity to its advisories, so Trivy reports them
      # UNKNOWN and the CRITICAL/HIGH gate above ignores them forever — that is
      # how 27 fixable PostgreSQL client CVEs rode the published image behind a
      # green run. Fixable is the honest test: a fix exists upstream, and the
      # rebuild below is already built to apply it.
      #
      # These deliberately do NOT decide red or green. They only trigger the
      # rebuild and feed the report, so a low-severity finding gets fixed
      # quietly instead of either failing the run or being ignored.
      - name: Check the published image for fixable vulnerabilities at any severity
        id: advisory_app
        if: steps.pull_app.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.APP_IMAGE }}
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          timeout: 15m

      - name: Check the Front Desk image for fixable vulnerabilities at any severity
        id: advisory_frontdesk
        if: steps.pull_frontdesk.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.FRONTDESK_IMAGE }}
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          timeout: 15m

      # Single place that decides red or green. Every step above is
      # continue-on-error so none of them can abort the others, which means the
      # job's own status would be green no matter what happened; this step is
      # what makes it honest, and it names the failing step so the run does not
      # need archaeology to interpret.
      - name: Summarise scan outcomes
        if: always()
        env:
          OUTCOMES: >-
            pull_app=${{ steps.pull_app.outcome }}
            scan_app=${{ steps.scan_app.outcome }}
            upload_app=${{ steps.upload_app.outcome }}
            gate_app=${{ steps.gate_app.outcome }}
            pull_frontdesk=${{ steps.pull_frontdesk.outcome }}
            scan_frontdesk=${{ steps.scan_frontdesk.outcome }}
            upload_frontdesk=${{ steps.upload_frontdesk.outcome }}
            gate_frontdesk=${{ steps.gate_frontdesk.outcome }}
            advisory_app?=${{ steps.advisory_app.outcome }}
            advisory_frontdesk?=${{ steps.advisory_frontdesk.outcome }}
            pull_postgres?=${{ steps.pull_postgres.outcome }}
            scan_postgres?=${{ steps.scan_postgres.outcome }}
            postgres_summary?=${{ steps.postgres_summary.outcome }}
        run: |
          # shellcheck disable=SC2086 # deliberate split: one argument per outcome
          scripts/ci/summarise-scan-outcomes.sh $OUTCOMES

  # When the scan finds something fixable, try the cheap fix before asking a
  # human for anything: rebuild the SAME released source, which picks up current
  # Alpine security patches via the Dockerfile's apk upgrade.
  #
  # This deliberately rebuilds the release TAG, not master. Rebuilding master
  # would quietly put unreleased code behind :latest. The consequence is that a
  # rebuild only clears OS-level CVEs: anything coming from go.mod needs a code
  # change that exists only on master, so it cannot fix itself and the report job
  # says so instead of pretending otherwise.
  #
  # The trigger is fixable-at-any-severity, not the CRITICAL/HIGH gate. Keying it
  # to the gate left findings that this job could have fixed in one step sitting
  # on the published image indefinitely: nothing else rebuilds :latest, so a
  # below-gate finding had no path to ever being fixed or noticed.
  #
  # The two tiers run on different cadences, which is what `autofix` decides. A
  # CRITICAL/HIGH gate failure rebuilds on any run, because waiting a week to ship
  # a fix we already have is the thing this job exists to prevent. A below-gate
  # finding rebuilds only on the weekly slot or a manual dispatch. That asymmetry
  # is not tidiness: the publish step below ships on the CRITICAL/HIGH rescan
  # alone, so a below-gate finding a rebuild cannot shift makes every triggered
  # run push a fresh :latest digest that fixes nothing, and daily detection would
  # otherwise turn one wasted digest a week into one a day for as long as the
  # finding stands.
  #
  # Skipped on the release trigger. The rebuild's whole value is picking up
  # Alpine patches published since the image was built, and on that trigger the
  # image was built minutes ago by a runtime stage that buildx is forbidden to
  # cache (no-cache-filters: runtime), so its apk upgrade already pulled the
  # current patch level. Rebuilding would produce the same packages and republish
  # :latest at a new digest, splitting it from the release tag it was cut from,
  # in exchange for nothing. On that trigger this workflow only reports.
  refresh:
    name: Rebuild ${{ matrix.image }} from the current release
    needs: scan
    if: >-
      always() && github.event_name != 'workflow_run'
      && (needs.scan.outputs.app_gate == 'failure'
      || needs.scan.outputs.frontdesk_gate == 'failure'
      || (needs.scan.outputs.autofix == 'true'
      && (needs.scan.outputs.app_advisory == 'failure'
      || needs.scan.outputs.frontdesk_advisory == 'failure')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # packages write: the republish to GHCR uses GITHUB_TOKEN.
      packages: write
    # `triggered` keeps each leg tied to its OWN image's findings. The job runs
    # if either image needs a rebuild, and without this the other image would be
    # rebuilt and republished alongside it for no reason, handing everyone who
    # pulls it a new digest that fixes nothing.
    #
    # format() is not decoration. A bare comparison here yields a BOOLEAN, and
    # `matrix.triggered == 'true'` then compares a boolean to a string, which
    # GitHub resolves by casting both to numbers: true becomes 1, 'true' becomes
    # NaN, and the guard is false forever. That silently skipped every rebuild
    # step on the first real run. format() makes the value a string, so the
    # comparison below is string to string.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: model-hotel
            dockerfile: Dockerfile
            smoke: true
            triggered: ${{ format('{0}', needs.scan.outputs.app_gate == 'failure' || (needs.scan.outputs.autofix == 'true' && needs.scan.outputs.app_advisory == 'failure')) }}
          - image: model-hotel-frontdesk
            dockerfile: Dockerfile.frontdesk
            smoke: false
            triggered: ${{ format('{0}', needs.scan.outputs.frontdesk_gate == 'failure' || (needs.scan.outputs.autofix == 'true' && needs.scan.outputs.frontdesk_advisory == 'failure')) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modelhotel
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: modelhotel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # :latest always tracks the newest release, so that tag is the source the
      # published image was built from.
      - name: Resolve the released tag behind :latest
        id: release
        if: matrix.triggered == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh release view --json tagName --jq .tagName)
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-list -n1 "$tag")" >>"$GITHUB_OUTPUT"
          echo "Rebuilding from $tag"

      - name: Check out the released tag
        if: matrix.triggered == 'true'
        run: git checkout --detach "${{ steps.release.outputs.tag }}"

      - name: Rebuild the image
        if: matrix.triggered == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}:rebuild-candidate
          build-args: |
            VERSION=${{ steps.release.outputs.tag }}
            COMMIT=${{ steps.release.outputs.sha }}
          platforms: linux/amd64
          provenance: false
          # No cache: a cached apk upgrade layer is precisely what would make
          # this rebuild a no-op and waste the whole exercise.
          no-cache: true

      - name: Does the rebuild clear the findings?
        id: rescan
        if: matrix.triggered == 'true'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:rebuild-candidate
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          timeout: 15m

      # Whether the rebuild also cleared the below-gate backlog. This is recorded
      # and reported, but deliberately does NOT gate the republish: a fixable
      # finding that a no-cache rebuild cannot shift comes from go.mod, and
      # refusing to publish because of it would throw away the OS-level fixes
      # this rebuild does carry.
      - name: Does the rebuild clear the below-gate backlog too?
        id: rescan_advisory
        if: matrix.triggered == 'true'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:rebuild-candidate
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          timeout: 15m

      # Nothing else in this repo smoke-tests an image before publishing; the
      # release path relies on the full suite passing before the build. A
      # rebuild runs none of that, so this is the only thing standing between a
      # broken base-image update and everyone who pulls :latest.
      - name: Smoke test the rebuilt image
        id: smoke
        if: matrix.triggered == 'true' && matrix.smoke && steps.rescan.outcome == 'success'
        continue-on-error: true
        env:
          IMAGE: ${{ matrix.image }}:rebuild-candidate
        run: scripts/ci/smoke-test-image.sh "$IMAGE"

      # :latest must stay one digest across both registries (the scan job only
      # looks at GHCR, and Docker Hub is what everyone else pulls), so the
      # rebuilt image goes to both. GHCR first: it is what our own stacks run.
      - name: Publish the rebuilt image as :latest
        id: publish
        if: >-
          matrix.triggered == 'true'
          && steps.rescan.outcome == 'success'
          && (matrix.smoke != true || steps.smoke.outcome == 'success')
        env:
          IMAGE: ${{ matrix.image }}
          GHCR_TARGET: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          DOCKERHUB_TARGET: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          for target in "$GHCR_TARGET" "$DOCKERHUB_TARGET"; do
            docker tag "$IMAGE:rebuild-candidate" "$target"
            docker push "$target"
            echo "Republished $target"
          done

      - name: Record what happened
        if: always()
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ steps.release.outputs.tag }}
          RESCAN: ${{ steps.rescan.outcome }}
          RESCAN_ADVISORY: ${{ steps.rescan_advisory.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          mkdir -p refresh-status
          {
            echo "image=$IMAGE"
            echo "tag=$TAG"
            echo "rebuild_clean=$RESCAN"
            echo "rebuild_clean_advisory=$RESCAN_ADVISORY"
            echo "smoke=$SMOKE"
            echo "published=$PUBLISH"
          } >"refresh-status/$IMAGE.txt"

      - name: Upload status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refresh-status-${{ matrix.image }}
          path: refresh-status/

  # One issue, reused, that says what it wants from you. This scan's only output
  # used to be a failure email, and an email that says "network error" on the one
  # run that mattered is how a real finding went unnoticed.
  #
  # A skipped scan is not a clean scan. The scan job skips when a failed release
  # triggers this workflow, and reporting on its empty outputs would read as
  # nothing-found and close a tracking issue that is still legitimately open.
  report:
    name: Report scan result
    needs: [scan, refresh]
    if: >-
      always() && needs.scan.result != 'cancelled'
      && needs.scan.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # security-events read: the report says what is actually open in the
      # Security tab, which is the whole point of this job existing.
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download refresh status
        if: needs.refresh.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: refresh-status-*
          merge-multiple: true
          path: refresh-status

      # Read back what this run just uploaded. Waiting on the SARIF ids matters:
      # GitHub processes uploads asynchronously, and reading too early would
      # report the previous run's picture, which on the week a backlog first
      # appears is the difference between telling you and not.
      - name: Summarise the Security tab
        id: digest
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # The ref the uploads above recorded their alerts against, so the
          # report can never describe a different branch than the one scanned.
          REF: ${{ github.ref }}
          SARIF_IDS: >-
            ${{ needs.scan.outputs.app_sarif }}
            ${{ needs.scan.outputs.frontdesk_sarif }}
        run: scripts/ci/summarise-code-scanning.sh code-scanning.md

      - name: Add the summary to the run
        if: always()
        run: cat code-scanning.md >>"$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Compose and file the report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_GATE: ${{ needs.scan.outputs.app_gate }}
          FRONTDESK_GATE: ${{ needs.scan.outputs.frontdesk_gate }}
          APP_ADVISORY: ${{ needs.scan.outputs.app_advisory }}
          FRONTDESK_ADVISORY: ${{ needs.scan.outputs.frontdesk_advisory }}
          BACKLOG: ${{ steps.digest.outputs.fixable_backlog }}
          DIGEST_FILE: code-scanning.md
          POSTGRES_LINE: ${{ needs.scan.outputs.postgres_line }}
          # Lets the report tell "the rebuild is not due yet" apart from "the
          # rebuild tried and did not get there", which read identically before
          # the below-gate tier had a cadence of its own.
          AUTOFIX: ${{ needs.scan.outputs.autofix }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/ci/compose-scan-report.sh
