name: Publish Docker Image

on:
  push:
    branches: [master]
    paths:
      - .version
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/model-hotel
  DOCKERHUB_FRONTDESK_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/model-hotel-frontdesk

jobs:
  publish:
    name: Build & Push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            echo "skip_existing=false" >> "$GITHUB_OUTPUT"
          else
            ver=$(tr -d '[:space:]' < .version)
            tag="v${ver}"
            if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
              echo "Tag ${tag} already exists, skipping build"
              echo "tag=${tag}" >> "$GITHUB_OUTPUT"
              echo "skip_existing=true" >> "$GITHUB_OUTPUT"
            else
              echo "New version: ${tag}"
              echo "tag=${tag}" >> "$GITHUB_OUTPUT"
              echo "skip_existing=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Create git tag
        if: steps.version.outputs.skip_existing == 'false' && github.event_name != 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Log in to GHCR
        if: steps.version.outputs.skip_existing == 'false'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.version.outputs.skip_existing == 'false'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        if: steps.version.outputs.skip_existing == 'false'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        if: steps.version.outputs.skip_existing == 'false'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Assert the runtime stage the cache filter targets exists
        if: steps.version.outputs.skip_existing == 'false'
        run: |
          set -euo pipefail
          # buildx ignores --no-cache-filter for a stage name it cannot find, so
          # renaming the runtime stage would silently restore the stale-package
          # bug the filter below exists to prevent.
          for f in Dockerfile Dockerfile.frontdesk; do
            if ! grep -qE '^FROM .+ AS runtime$' "$f"; then
              echo "::error::$f declares no 'AS runtime' stage; no-cache-filters: runtime would be a no-op"
              exit 1
            fi
          done

      - name: Build and push
        if: steps.version.outputs.skip_existing == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The layer cache is for the builder stages only. Serving the
          # runtime stage from it would reuse the Dockerfile's apk upgrade from
          # whenever that layer was first built, so a release would ship OS
          # packages frozen in the past and image-scan.yml would file the Alpine
          # CVEs a fresh build of the same commit never has.
          no-cache-filters: runtime
          platforms: linux/amd64
          provenance: false

      # Front Desk control-plane image (HA stack), published to the same two
      # registries under the -frontdesk repo. Reuses the Buildx instance and
      # registry logins above; a distinct gha cache scope keeps it off the
      # server image's cache so neither build evicts the other's layers.
      - name: Extract metadata (Front Desk)
        if: steps.version.outputs.skip_existing == 'false'
        id: meta-frontdesk
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontdesk
            ${{ env.DOCKERHUB_FRONTDESK_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-

      - name: Build and push Front Desk
        if: steps.version.outputs.skip_existing == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.frontdesk
          push: true
          tags: ${{ steps.meta-frontdesk.outputs.tags }}
          labels: ${{ steps.meta-frontdesk.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=frontdesk
          cache-to: type=gha,mode=max,scope=frontdesk
          # The layer cache is for the builder stages only. Serving the
          # runtime stage from it would reuse the Dockerfile's apk upgrade from
          # whenever that layer was first built, so a release would ship OS
          # packages frozen in the past and image-scan.yml would file the Alpine
          # CVEs a fresh build of the same commit never has.
          no-cache-filters: runtime
          platforms: linux/amd64
          provenance: false

      # Publish a GitHub Release for the freshly-pushed tag with auto-generated
      # notes (grouped per .github/release.yml). Until now each release got a
      # git tag + image but no human-readable notes; this fills that gap so
      # self-hosters can see what changed before pulling. Non-blocking.
      - name: Create GitHub Release
        if: steps.version.outputs.skip_existing == 'false' && github.event_name != 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "${{ steps.version.outputs.tag }}"

      # Docker Hub repository descriptions (DOCKERHUB.md / DOCKERHUB-frontdesk.md)
      # are NOT synced here — they are decoupled from image builds and pushed by
      # sync-dockerhub-readme.yml whenever the Hub copy changes on master. A
      # README edit does not need a release to show up on Docker Hub.
