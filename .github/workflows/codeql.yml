name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, off-peak, deliberately off the :00 mark.
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on PR branches, but never cancel in-flight runs on master.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Analysing all five languages on every change meant a full no-daemon Gradle
  # build of Bellhop, a Go autobuild, and a JS/TS extraction on pushes containing
  # none of those languages: 481 runner-seconds for a docs-only PR. This job
  # builds the matrix from what actually changed, sharing ci.yml's gate via the
  # composite action so the two cannot drift.
  #
  # Unlike ci.yml this gate does NOT gate the job, it shrinks the matrix. The
  # per-language `Analyze (...)` checks are not required contexts, so there is no
  # skipped-leg hazard; what matters is that `actions` is always in the list, so
  # SOME analysis is always uploaded and the required "CodeQL" context (posted by
  # the code-scanning app, not by a job here) always reports.
  changes:
    name: CodeQL Surfaces
    runs-on: ubuntu-latest
    outputs:
      langs: ${{ steps.filter.outputs.codeql_langs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        uses: ./.github/actions/changed-surfaces

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Pure-Kotlin (Bellhop) cannot be extracted with build-mode: none; it
        # needs a real Gradle build (build-mode: manual). The build modes are
        # paired with their languages inside the action.
        include: ${{ fromJSON(needs.changes.outputs.langs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Toolchain for the Kotlin/Gradle build (java-kotlin leg only).
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Manual build for java-kotlin: compiling the Kotlin is what the CodeQL
      # extractor consumes (via the LD_PRELOAD build tracer set up by init).
      # The tracer follows every descendant of THIS step, but it cannot see a
      # reused Kotlin daemon, so the build must fork its compiler here and skip
      # every cache that would let a compile task go up-to-date:
      #   --no-daemon                              Gradle work runs in the traced foreground JVM
      #   --no-build-cache / --no-configuration-cache  override org.gradle.caching /
      #                                            configuration-cache in gradle.properties so
      #                                            compile tasks actually re-run and are traced
      #   -Pkotlin.compiler.execution.strategy=out-of-process  fork kotlinc as a direct child of
      #                                            the Gradle JVM: traced like the daemon is not,
      #                                            but with a clean classpath. `in-process` shares
      #                                            the Gradle JVM's classpath, and Gradle 9.7
      #                                            embeds Kotlin 2.4.0 while AGP's built-in Kotlin
      #                                            compiles with 2.2.10, so the Compose plugin dies
      #                                            on `AbstractMethodError: ComposePluginRegistrar
      #                                            does not define getPluginId()`.
      # `clean` guarantees a from-scratch compile. Without these, the extractor reports
      # "no source code seen during build" and the analysis fails.
      - if: matrix.language == 'java-kotlin'
        name: Build Bellhop (Gradle, traced)
        working-directory: android
        run: >-
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache
          -Pkotlin.compiler.execution.strategy=out-of-process
          clean assembleDebug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:${{ matrix.language }}"
