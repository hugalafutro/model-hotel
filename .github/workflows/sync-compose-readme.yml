name: Sync docker-compose.yml to README

on:
  push:
    paths:
      - docker-compose.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync docker-compose.yml into README and DOCKERHUB
        run: |
          # The compose file goes into the fenced block verbatim, so a copy needs no re-indenting
          COMPOSE_CONTENT=$(cat docker-compose.yml)

          # Refuse to embed content that would escape the fenced yaml block or the markers:
          # - a fence closer indented 0-3 spaces closes the outer ```yaml fence in CommonMark,
          #   and everything after it renders as page markdown/HTML instead of yaml
          #   (LC_ALL=C keeps [[:blank:]] to the ASCII space and tab CommonMark allows there);
          # - a CR ends a line for CommonMark but not for grep, so it could hide such a closer;
          # - a copy of an AUTO-SYNC marker would cut the next sync's replacement short.
          if printf '%s\n' "$COMPOSE_CONTENT" | LC_ALL=C grep -Eq \
              -e '^ {0,3}```+[[:blank:]]*$' -e $'\r' -e 'AUTO-SYNC: docker-compose\.yml'; then
            echo "::error::docker-compose.yml contains a code fence, a CR, or an AUTO-SYNC marker that would break the block in README/DOCKERHUB; refusing to sync" >&2
            exit 1
          fi

          # Build the replacement block
          REPLACEMENT=$(cat <<'BLOCK_END'
          <!-- AUTO-SYNC: docker-compose.yml start -->
          <details>
          <summary>docker-compose.yml (click to expand, then copy)</summary>

          ```yaml
          BLOCK_END
          )
          REPLACEMENT="${REPLACEMENT}
          ${COMPOSE_CONTENT}
          "
          REPLACEMENT="${REPLACEMENT}$(cat <<'BLOCK_END'
          ```

          </details>
          <!-- AUTO-SYNC: docker-compose.yml end -->
          BLOCK_END
          )"

          # Use Python to replace between the markers (awk/sed are fragile with multiline)
          python3 -c '
          import sys, re

          start_marker = "<!-- AUTO-SYNC: docker-compose.yml start -->"
          end_marker = "<!-- AUTO-SYNC: docker-compose.yml end -->"
          pattern = re.escape(start_marker) + r".*?" + re.escape(end_marker)

          # Read the replacement from stdin; apply to both README surfaces
          # (GitHub README and DockerHub) so the collapsible compose block
          # never drifts between them.
          replacement = sys.stdin.read().strip()
          for path in ("README.md", "DOCKERHUB.md"):
              with open(path, "r") as f:
                  txt = f.read()
              # A callable replacement is inserted literally: a backslash in the
              # compose file is never read as a group reference or escape.
              new = re.sub(pattern, lambda m: replacement, txt, flags=re.DOTALL)
              with open(path, "w") as f:
                  f.write(new)
          ' <<< "$REPLACEMENT"

      - name: Commit if changed
        run: |
          git diff --quiet README.md DOCKERHUB.md && echo "No changes" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md DOCKERHUB.md
          git commit -m "docs: sync docker-compose.yml to README and DOCKERHUB"
          git push
