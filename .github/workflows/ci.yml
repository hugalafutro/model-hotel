name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual :dev republish. Force-rebuilds and pushes the :dev images from the
  # current master HEAD, bypassing the change-gate. Use it when an automatic
  # publish was missed: a transient CI flake failed the run that carried an
  # image change, or the follow-up commits only touched non-image files so the
  # gate skipped them. The gate below also self-heals such strands on the next
  # push, so this is the belt to that suspenders.
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs when a PR branch is force-pushed/updated, but never
# cancel in-flight runs on master itself.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which parts of the tree this push/PR actually touches, so the gates below can
  # skip work that cannot possibly be affected. A README edit has no business
  # starting Postgres, sharding 5.6k vitest tests, or building a Docker image.
  #
  # Gating is per JOB (`if:`), never via `on.paths`, and that is load-bearing: a
  # workflow skipped by a path filter never creates its check runs, so every
  # required context stays "Expected — waiting for status" and the PR can never
  # merge. A job skipped by a conditional reports Success and satisfies branch
  # protection. See GitHub's "Troubleshooting required status checks".
  #
  # Fail-OPEN on purpose. Every gate below tests `!= 'false'`, so an output this
  # job never wrote (empty string) runs the job anyway, and the action it calls
  # answers "I don't know" with run-everything rather than a silent skip. The
  # failure mode of a bug here must be a wasted run, never an untested merge —
  # a skipped required check counts as passing, so a gate that guesses "unchanged"
  # would wave work through. This job is itself a REQUIRED check, so a gate that
  # dies blocks the PR instead of skipping (= passing) everything below it.
  changes:
    name: Changed Surfaces
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      fdweb: ${{ steps.filter.outputs.fdweb }}
      workflows: ${{ steps.filter.outputs.workflows }}
      deps: ${{ steps.filter.outputs.deps }}
      i18n: ${{ steps.filter.outputs.i18n }}
      sizegate: ${{ steps.filter.outputs.sizegate }}
      image: ${{ steps.filter.outputs.image }}
      measurable: ${{ steps.filter.outputs.measurable }}
      all_coverage: ${{ steps.filter.outputs.all_coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Shared with codeql.yml. A composite action, not a reusable workflow:
      # `uses:` at job level would rename this check to "<caller> / <called>",
      # and "Changed Surfaces" is a required context.
      - id: filter
        uses: ./.github/actions/changed-surfaces

  go-test:
    name: Go Test
    needs: changes
    # `!= 'false'` and not `== 'true'`: an output the gate never wrote must run
    # the job, not skip it.
    if: >-
      needs.changes.outputs.go != 'false'
      || needs.changes.outputs.all_coverage != 'false'
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: changeme
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modelhotel
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: testdb
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pg_dump / pg_restore for backup tests
        # The backup integration tests (internal/api/backup_test.go) exec
        # pg_dump and pg_restore; without these binaries ~26 tests t.Skip and
        # the backup/restore round-trip goes entirely untested. ubuntu-latest's
        # postgresql-client meta-package ships v16, matching the postgres:16
        # service container.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgres://modelhotel:${{ env.POSTGRES_PASSWORD }}@localhost:5433/testdb?sslmode=disable
        # -timeout is per package, not for the whole run, and internal/api is by
        # far the largest: ~1,450 tests against a real Postgres, several minutes
        # on a shared runner. At 5m it panicked with no test hung — the package
        # simply outgrew the clock, and every future test added to it walked the
        # margin down further. 10m is headroom, not a licence: a package that
        # actually deadlocks still fails here well inside the job timeout.
        run: go test -timeout 10m -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check coverage (90% threshold)
        run: |
          # Filter out cmd/ and tools/ from coverage calculation
          filtered=$(mktemp)
          { head -1 coverage.out; grep -vE '^github\.com/hugalafutro/model-hotel/(cmd|tools)/' coverage.out | tail -n +2; } > "$filtered"
          pct=$(go tool cover -func="$filtered" | tail -1 | awk '{print $NF}' | tr -d '%')
          rm -f "$filtered"
          pct_int=${pct%%.*}
          echo "Coverage: ${pct}%"
          if [ "$pct_int" -lt 90 ]; then
            echo "FAIL: coverage ${pct}% is below 90% threshold"
            exit 1
          fi

      - name: Upload Go coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 1

  # The race detector, over every package. Nothing is excluded for cost: the
  # slow suites are slow on database round-trips, which instrumentation does not
  # multiply, so the whole tree races in about the time internal/proxy takes on
  # its own.
  #
  # Un-raced, the suites written for exactly this (internal/failover/
  # circuitbreaker_race_test.go among them) pass while a data race goes
  # unreported. The first run of this job found one, in the app-log writer's
  # flush interval.
  go-race:
    name: Go Race
    needs: changes
    if: needs.changes.outputs.go != 'false'
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: changeme
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modelhotel
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: testdb
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # internal/api's backup tests exec these; without them ~26 tests skip and
      # the race job silently stops covering the backup round-trip.
      - name: Install pg_dump / pg_restore for backup tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # A longer clock than go-test's 10m: the detector's slowdown lands on
      # internal/api, the one package already near that limit.
      - name: go test -race
        env:
          TEST_DATABASE_URL: postgres://modelhotel:${{ env.POSTGRES_PASSWORD }}@localhost:5433/testdb?sslmode=disable
        run: go test -race -count=1 -timeout 20m ./...

  go-lint:
    name: Go Lint
    needs: changes
    if: needs.changes.outputs.go != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13

  go-vet:
    name: Go Vet
    needs: changes
    if: needs.changes.outputs.go != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

  # Unlike the image scan's gobinary check, govulncheck does reachability
  # analysis: it only fails on vulnerable functions our code actually calls.
  govulncheck:
    name: Go Vulncheck
    needs: changes
    if: needs.changes.outputs.go != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  i18n-check:
    name: i18n Check
    needs: changes
    if: needs.changes.outputs.i18n != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails when any locale is missing keys, breaks {{placeholder}} parity,
      # or ships a new English-only string. This check is fully OFFLINE.
      # Fix locally by translating the new keys into all locales by hand;
      # intentional English goes into tools/i18n-translate/allow-english.json.
      - name: locale sync check
        run: make i18n-check

  # File-size ratchet: 800 lines of production code, 2000 of tests, with every
  # current offender pinned to its recorded count in scripts/ci/size-allowlist.txt.
  # Gated on the surfaces it reads: go covers internal/ and cmd/, web and fdweb
  # cover both SPA sources and the web-shared/ code they compile, and sizegate
  # covers the gate's own files, since dropping an allowlist entry is itself
  # something to adjudicate. On pull requests the job runs unconditionally: the
  # changed-surfaces classifier is checked out from the pull request itself, so a
  # PR could edit the classifier to report nothing changed and skip the very job
  # that adjudicates it. The gating applies to pushes, where the classifier comes
  # from the merged tree.
  size-check:
    name: Size Check
    needs: changes
    if: >-
      github.event_name == 'pull_request' ||
      needs.changes.outputs.go != 'false' ||
      needs.changes.outputs.web != 'false' ||
      needs.changes.outputs.fdweb != 'false' ||
      needs.changes.outputs.sizegate != 'false' ||
      needs.changes.outputs.workflows != 'false'
    runs-on: ubuntu-latest
    steps:
      # The base commit is fetched explicitly below, so the default shallow
      # checkout is all this job needs of the branch's own history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The allowlist ships in the branch, so a branch could exempt whatever it
      # just grew by editing it. The gate therefore compares it against the base
      # commit's copy, which is what makes "the list only shrinks" a check rather
      # than a comment.
      #
      # A pull request compares against its base SHA. A push compares against the
      # SHA master carried BEFORE the push, not against HEAD~1: a push can carry
      # several commits, and HEAD~1 would only cover the last of them, so an
      # earlier commit in the same push could loosen the allowlist unseen. A push
      # that reports no previous SHA (branch creation, or the shape a force push
      # takes) has no state to compare with and fails rather than falling back.
      - name: resolve the base for the allowlist comparison
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
              echo "ref=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
              ;;
            push)
              if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
                echo "size gate: this push reports no previous SHA, so the allowlist cannot be compared against the state it replaced" >&2
                exit 1
              fi
              git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
              echo "ref=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # A manual dispatch replaces nothing, so there is no earlier state
              # to compare with. The file checks still run against the tree.
              echo "ref=HEAD" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # Fails when a file crosses its ceiling with no allowlist entry, when an
      # allowlisted file grows past its recorded count, when an entry has gone
      # stale, and when the allowlist itself gained an entry or raised a count
      # since the base. Split the file; the allowlist takes no new entries.
      - name: size gate
        env:
          SIZE_GATE_BASE: ${{ steps.base.outputs.ref }}
        run: make size-check

  workflow-lint:
    name: Workflow Lint
    needs: changes
    if: needs.changes.outputs.workflows != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Uses the preinstalled shellcheck on the runner for run: blocks
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  frontend-checks:
    name: Frontend Lint & Build
    needs: changes
    if: needs.changes.outputs.web != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check (biome)
        # `biome check` (no --write) fails on any formatter/linter/assist drift,
        # so formatting + import-order + lint regressions are caught at PR time.
        run: pnpm run format

      - name: Build
        run: pnpm run build

  # The 5k-test vitest suite was the sole CI wall-clock bottleneck (~7-8 min),
  # so it is split into parallel shards. Each shard writes a blob report (with
  # embedded coverage); frontend-coverage merges them for the gate.
  # The ONLY job here gated per STEP rather than at job level, and it has to be:
  # each shard is separately named in branch protection, and a matrix job skipped
  # by a job-level `if:` is never expanded, so those three check runs are never
  # created at all and the PR waits on them forever (actions/runner#952). Skipped
  # STEPS still let each leg report, so the contexts resolve. The cost of a
  # no-op leg is the runner spin-up, seconds against the suite's minutes.
  frontend-test:
    name: Frontend Test (shard ${{ matrix.shard }}/3)
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: web
    env:
      RUN: >-
        ${{ needs.changes.outputs.web != 'false'
        || needs.changes.outputs.all_coverage != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: env.RUN == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - if: env.RUN == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        if: env.RUN == 'true'
        run: pnpm install --frozen-lockfile

      # blob feeds the coverage merge in frontend-coverage. github-actions
      # surfaces failures as inline log annotations so a flaky or failing
      # test is named directly in the Actions log (blob writes only to
      # files, leaving the console silent on failure).
      - name: Test (shard ${{ matrix.shard }}/3)
        if: env.RUN == 'true'
        run: >-
          pnpm exec vitest run --coverage
          --reporter=blob --outputFile.blob=.vitest-reports/blob-${{ matrix.shard }}.json
          --reporter=github-actions
          --shard=${{ matrix.shard }}/3

      - name: Upload blob report
        if: env.RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: web/.vitest-reports/*
          include-hidden-files: true
          retention-days: 1

      - name: No frontend changes
        if: env.RUN != 'true'
        run: echo "web/ unchanged on this ${{ github.event_name }}; shard ${{ matrix.shard }}/3 has nothing to run"

  frontend-coverage:
    name: Frontend Coverage Gate
    needs: [changes, frontend-test]
    if: >-
      needs.changes.outputs.web != 'false'
      || needs.changes.outputs.all_coverage != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vitest-blob-*
          path: web/.vitest-reports
          merge-multiple: true

      - name: Merge shard reports + coverage
        run: pnpm exec vitest --mergeReports --coverage

      - name: Check frontend coverage (90% threshold)
        run: |
          # The merge step above always writes this; a missing file means the
          # shard merge failed, so fail loudly rather than skip the gate.
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "FAIL: no coverage-summary.json — shard merge produced no coverage"
            exit 1
          fi
          pct=$(python3 -c "
          import json,sys
          d=json.load(open('coverage/coverage-summary.json'))
          total=d.get('total',{})
          pct=total.get('lines',{}).get('pct',0)
          print(pct)
          ")
          pct_int=${pct%%.*}
          echo "Frontend coverage: ${pct}%"
          if [ "$pct_int" -lt 90 ]; then
            echo "FAIL: frontend coverage ${pct}% is below 90% threshold"
            exit 1
          fi

      - name: Upload web coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-coverage
          path: |
            web/coverage/lcov.info
            web/coverage/coverage-summary.json
          retention-days: 1

  frontdesk-web-test:
    name: Front Desk Web Test
    needs: changes
    if: >-
      needs.changes.outputs.fdweb != 'false'
      || needs.changes.outputs.all_coverage != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontdesk/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontdesk/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check (biome)
        # `biome check` (no --write) fails on any formatter/linter/assist drift,
        # so formatting + import-order + lint regressions are caught at PR time.
        run: pnpm run format

      - name: Build
        run: pnpm run build

      - name: Test coverage (90% threshold)
        run: >-
          pnpm exec vitest run --coverage
          --coverage.reporter=lcov --coverage.reporter=json-summary

      - name: Check Front Desk web coverage (90% threshold)
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "FAIL: no coverage-summary.json"
            exit 1
          fi
          pct=$(python3 -c "import json;print(json.load(open('coverage/coverage-summary.json'))['total']['lines']['pct'])")
          pct_int=${pct%%.*}
          echo "Front Desk web coverage: ${pct}%"
          if [ "$pct_int" -lt 90 ]; then
            echo "FAIL: Front Desk web coverage ${pct}% below 90% threshold"
            exit 1
          fi

      - name: Upload Front Desk web coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fdweb-coverage
          path: |
            frontdesk/web/coverage/lcov.info
            frontdesk/web/coverage/coverage-summary.json
          retention-days: 1

  coverage-diff:
    name: Coverage Diff Gate
    runs-on: ubuntu-latest
    # `!cancelled()` rather than the implicit success(): on a web-only PR the Go
    # suite is skipped, and a skipped dependency would otherwise skip this gate
    # too, silently dropping the diff check for the code that DID change. A
    # genuinely failing suite still blocks the PR on its own check.
    if: >-
      !cancelled() && github.event_name == 'pull_request'
      && needs.changes.outputs.measurable != 'false'
    needs: [changes, go-test, frontend-coverage, frontdesk-web-test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Each download is gated on the same surface as the job that uploads it:
      # asking for an artifact a skipped job never produced fails the step.
      - if: needs.changes.outputs.go != 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-coverage
          path: cov/go

      - if: needs.changes.outputs.web != 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-coverage
          path: cov/web

      - if: needs.changes.outputs.fdweb != 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fdweb-coverage
          path: cov/fdweb

      - name: Coverage script self-tests
        run: cd scripts/coverage && python3 -m unittest discover -p 'test_*.py'

      - name: Ensure base ref is available
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF"

      # Only the surfaces that ran contribute a profile. diff_coverage.py ignores
      # changed files it has no coverage data for, so a subset is not a loophole:
      # a file is only skipped when its own suite was skipped, which only happens
      # when nothing under that surface changed.
      - name: Check diff coverage (90% threshold)
        env:
          BASE_REF: ${{ github.base_ref }}
          GO: ${{ needs.changes.outputs.go }}
          WEB: ${{ needs.changes.outputs.web }}
          FDWEB: ${{ needs.changes.outputs.fdweb }}
        run: |
          set -euo pipefail
          args=(--diff-base "origin/$BASE_REF" --threshold 90)
          if [ "$GO" != false ]; then
            args+=(--go cov/go/coverage.out)
          fi
          if [ "$WEB" != false ]; then
            args+=(--lcov "web/=cov/web/lcov.info")
          fi
          if [ "$FDWEB" != false ]; then
            args+=(--lcov "frontdesk/web/=cov/fdweb/lcov.info")
          fi
          python3 scripts/coverage/diff_coverage.py "${args[@]}"

  coverage-aggregate:
    name: Coverage Aggregate
    runs-on: ubuntu-latest
    # The badge is one number over all three suites, so this runs only when all
    # three have reported — which on a push is exactly when any measurable
    # surface changed (see all_coverage in the gate above). A docs-only push
    # changes no coverage, so leaving the badge alone is the correct answer.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master'
      && needs.changes.outputs.measurable != 'false'
    needs: [changes, go-test, frontend-coverage, frontdesk-web-test]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-coverage
          path: cov/go

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-coverage
          path: cov/web

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fdweb-coverage
          path: cov/fdweb

      - name: Coverage script self-tests
        run: cd scripts/coverage && python3 -m unittest discover -p 'test_*.py'

      - name: Compute overall coverage + badge JSON (90% threshold)
        run: >-
          python3 scripts/coverage/aggregate_coverage.py
          --go cov/go/coverage.out
          --summary cov/web/coverage-summary.json
          --summary cov/fdweb/coverage-summary.json
          --threshold 90 --out coverage.json --label coverage

      - name: Publish badge JSON to the badges branch
        # always() so the public badge shows the true current number even when the
        # aggregate step fails the 90% gate; otherwise a regression freezes the badge
        # at the last passing (inflated) value. aggregate_coverage.py writes
        # coverage.json before the threshold check, so the file exists here. The job
        # itself still fails the gate.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp coverage.json "$tmp/coverage.json"
          cd "$tmp"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b badges
          git add coverage.json
          git commit -q -m "chore(badges): coverage $(python3 -c "import json;print(json.load(open('coverage.json'))['message'])")"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" badges:badges

  # Guards against THIRD-PARTY-NOTICES.md drifting from the actual dependency
  # set: regenerate it and fail if the committed copy differs. The generator is
  # deterministic, so any diff means someone changed deps without running
  # `make notices`.
  notices:
    name: Third-Party Notices
    needs: changes
    if: needs.changes.outputs.deps != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # make notices shells out to `pnpm licenses list`, which needs the
      # production graph installed from the committed lockfile.
      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Regenerate notices
        run: make notices

      - name: Verify THIRD-PARTY-NOTICES.md is up to date
        run: |
          if ! git diff --exit-code THIRD-PARTY-NOTICES.md; then
            echo "THIRD-PARTY-NOTICES.md is stale — run 'make notices' and commit the result." >&2
            exit 1
          fi

  docker-build:
    name: Docker Build
    needs: changes
    if: needs.changes.outputs.image != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build -t model-hotel:ci .

      # Gate on fixable HIGH/CRITICAL vulns only: ignore-unfixed keeps CI green
      # when a CVE has no upstream patch yet (nothing actionable), and the
      # `apk upgrade` in the Dockerfile means a fixable Alpine CVE usually
      # clears on rebuild alone.
      - name: Scan image for fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: model-hotel:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

  # Publish a rolling :dev image to GHCR and Docker Hub on every master commit,
  # so a second "staging" instance can track master by pointing its compose
  # image: line at ghcr.io/hugalafutro/model-hotel:dev (vs :latest for prod).
  # Both registries get the same digest, same as the release publish, so either
  # is a drop-in for the other.
  #
  # This is a dedicated job (not a step in docker-build) so it can `needs:` the
  # full required gate set: a master commit that fails Go tests, the race
  # detector, lint, vet, vulncheck, coverage, i18n, the workflow lint, the
  # frontend gates, or the Docker build + Trivy scan never becomes a staging
  # image. It runs only on
  # direct pushes to master (never PRs, which can't see secrets) and skips if
  # master HEAD has already moved past this commit, so a slow older run can't
  # overwrite :dev with a stale image after a newer commit already published it.
  # The image carries no VERSION build-arg, so it self-reports version "dev".
  # `dev` is a protected moving tag in the prune workflow, so the live :dev
  # image always survives a prune; superseded :dev digests become untagged
  # GHCR versions and are reclaimed by it (Docker Hub drops them on overwrite).
  publish-dev:
    name: Publish :dev image
    runs-on: ubuntu-latest
    # `!failure() && !cancelled()` instead of the implicit success(): the gate
    # above skips whichever suites this commit cannot have affected, and a
    # skipped dependency would otherwise skip the publish, stranding :dev on a
    # web-only or Go-only push. `!failure()` still means every needed job either
    # passed or was skipped, so a red suite never becomes a staging image.
    if: >-
      !failure() && !cancelled()
      && ((github.event_name == 'push' && github.ref == 'refs/heads/master')
      || github.event_name == 'workflow_dispatch')
    needs:
      # The gate itself is a dependency: if it fails, every suite below it is
      # skipped rather than failed, and `!failure()` would otherwise read that
      # as "nothing went wrong" and publish an entirely untested image.
      - changes
      - go-test
      - go-race
      - go-lint
      - go-vet
      - govulncheck
      - i18n-check
      - workflow-lint
      - frontend-checks
      - frontend-test
      - frontend-coverage
      - frontdesk-web-test
      - notices
      - docker-build
    # No concurrency group on purpose: GitHub keeps only one *pending* job per
    # group and cancels an older pending one when a newer queues, which could
    # drop a fully-gated publish candidate. Instead every run builds and the
    # push step re-checks HEAD, so only the run that is still master HEAD at push
    # time publishes (newest-wins, never a rollback).
    permissions:
      # write: after publishing, the push step moves the dev-published marker ref
      # to the commit it just pushed, so the change-gate can diff future pushes
      # against what is actually live on :dev (self-healing a stranded change).
      contents: write
      # packages write: the :dev push to GHCR uses GITHUB_TOKEN.
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
      GHCR_FRONTDESK_IMAGE: ghcr.io/${{ github.repository }}-frontdesk
      DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/model-hotel
      DOCKERHUB_FRONTDESK_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/model-hotel-frontdesk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Early bail-out: if this commit is already behind master HEAD, skip the
      # whole build/scan. This is only an optimization — the authoritative guard
      # is the re-check in the push step, which closes the window where HEAD
      # moves while this job is still building.
      - name: Skip if already superseded by a newer master commit
        id: head
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ -z "$remote_head" ]; then
            echo "::error::could not read master HEAD from origin"
            exit 1
          fi
          if [ "$remote_head" = "$COMMIT_SHA" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "master HEAD is $remote_head, not $COMMIT_SHA; skipping stale :dev publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if only non-image files changed since the last published :dev
        id: changes
        if: steps.head.outputs.skip == 'false'
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A manual dispatch is an explicit "rebuild :dev now" — always build.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "manual dispatch; building :dev unconditionally"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Diff against the commit the CURRENTLY-LIVE :dev image was built from —
          # the dev-published marker ref the push step moves — not just this push's
          # immediate parent. That self-heals a stranded image change: if the run
          # that carried it never published (a flake failed the run, or it was
          # superseded while building), the diff from what is actually live still
          # sees the change, so the next master push rebuilds instead of leaving
          # :dev silently stale. Fail closed: any doubt about the base builds.
          base=$( { git ls-remote origin refs/tags/dev-published || true; } | cut -f1)
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "no usable dev-published marker; building to be safe"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failed diff exits the step (set -e) rather than being swallowed into
          # an empty result: a loud failure beats a silent skip. An empty diff
          # (base == HEAD) legitimately means nothing new to publish.
          changed=$(git diff --name-only "$base" "$HEAD_SHA")
          # The :dev image carries the compiled Go binary (cmd/ + internal/) and
          # the built+embedded frontend (web/, frontdesk/web/, and the
          # web-shared/ module both of them bundle). Docs, screenshots,
          # wiki, AGENTS.md, CI workflows, the Makefile, and test files cannot
          # affect it. Drop test files first (not compiled or bundled), then match
          # the image-affecting surface the Dockerfiles COPY wholesale. Kept broad
          # on purpose: a wasted build is cheap, a stale :dev is not — a genuinely
          # new top-level COPY source must be added here.
          src=$(printf '%s\n' "$changed" | grep -vE '(_test\.go|\.test\.tsx?|\.spec\.tsx?)$' || true)
          code=$(printf '%s\n' "$src" | grep -E '^(internal/|cmd/|web/|web-shared/|frontdesk/web/|Dockerfile|docker-entrypoint|\.dockerignore|go\.mod|go\.sum)' || true)
          if [ -n "$code" ]; then
            echo "image-affecting changes since last published :dev ($base); building:"
            printf '%s\n' "$code"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "no image-affecting changes since last published :dev ($base); skipping. Changed:"
            printf '%s\n' "$changed"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.changes.outputs.skip == 'false'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.changes.outputs.skip == 'false'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.changes.outputs.skip == 'false'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Build the candidate and load it into the local daemon so the very image
      # that gets scanned is the image that gets pushed (same digest). Scanning
      # docker-build's separate artifact would not cover base-image/Alpine drift
      # between that job and this rebuild.
      - name: Assert the runtime stage the cache filter targets exists
        if: steps.changes.outputs.skip == 'false'
        run: |
          set -euo pipefail
          # buildx ignores --no-cache-filter for a stage name it cannot find, so
          # renaming the runtime stage would silently restore the stale-package
          # bug the filter below exists to prevent.
          for f in Dockerfile Dockerfile.frontdesk; do
            if ! grep -qE '^FROM .+ AS runtime$' "$f"; then
              echo "::error::$f declares no 'AS runtime' stage; no-cache-filters: runtime would be a no-op"
              exit 1
            fi
          done

      - name: Build :dev candidate (load for scan)
        if: steps.changes.outputs.skip == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: model-hotel:dev-candidate
          # VERSION is left at its `dev` default; stamp the source SHA so the
          # dashboard can show which commit this :dev image was built from.
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The layer cache is for the builder stages only. Serving the
          # runtime stage from it would reuse the Dockerfile's apk upgrade from
          # whenever that layer was first built, publishing an image whose OS
          # packages are frozen in the past — the fixable-HIGH Alpine CVEs the
          # scan below then fails on, while an uncached build of the same commit
          # is clean.
          no-cache-filters: runtime
          platforms: linux/amd64
          provenance: false

      - name: Scan :dev candidate for fixable HIGH/CRITICAL vulnerabilities
        if: steps.changes.outputs.skip == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: model-hotel:dev-candidate
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      # Same build/scan for the Front Desk control-plane image, so the :dev
      # staging fleet gets a matching model-hotel-frontdesk:dev. A distinct gha
      # cache scope keeps it off the main image's cache; the push below is gated
      # on the same HEAD re-check so both images publish together or not at all.
      - name: Build :dev Front Desk candidate (load for scan)
        if: steps.changes.outputs.skip == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.frontdesk
          load: true
          tags: model-hotel-frontdesk:dev-candidate
          # VERSION stays at its `dev` default; stamp the source SHA so the
          # footer can show which commit this :dev image was built from.
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=frontdesk
          cache-to: type=gha,mode=max,scope=frontdesk
          # The layer cache is for the builder stages only. Serving the
          # runtime stage from it would reuse the Dockerfile's apk upgrade from
          # whenever that layer was first built, publishing an image whose OS
          # packages are frozen in the past — the fixable-HIGH Alpine CVEs the
          # scan below then fails on, while an uncached build of the same commit
          # is clean.
          no-cache-filters: runtime
          platforms: linux/amd64
          provenance: false

      - name: Scan :dev Front Desk candidate for fixable HIGH/CRITICAL vulnerabilities
        if: steps.changes.outputs.skip == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: model-hotel-frontdesk:dev-candidate
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      # Re-check HEAD immediately before pushing: if a newer master commit landed
      # while this job was building/scanning, that newer run will publish its own
      # image, so this (now-stale) run must not overwrite :dev with an older one.
      - name: Push the scanned images as :dev (only if still HEAD)
        id: push
        if: steps.changes.outputs.skip == 'false'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ -z "$remote_head" ]; then
            echo "::error::could not read master HEAD from origin"
            exit 1
          fi
          if [ "$remote_head" != "$COMMIT_SHA" ]; then
            echo "master HEAD moved to $remote_head; skipping stale :dev push for $COMMIT_SHA"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Same local image tagged for both registries, so :dev has one digest
          # everywhere. GHCR first: it is what the staging fleet pulls, so if
          # Docker Hub is having a moment the tag that matters still moves.
          for target in \
            "${GHCR_IMAGE}:dev" "${DOCKERHUB_IMAGE}:dev"; do
            docker tag model-hotel:dev-candidate "$target"
            docker push "$target"
          done
          for target in \
            "${GHCR_FRONTDESK_IMAGE}:dev" "${DOCKERHUB_FRONTDESK_IMAGE}:dev"; do
            docker tag model-hotel-frontdesk:dev-candidate "$target"
            docker push "$target"
          done
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Move the dev-published marker to the commit we just published so the next
      # push's change-gate diffs against what is actually live on :dev. Best-effort:
      # if the ref write is blocked, the images are already pushed, so never fail
      # the job over it — the gate just over-builds the next run (harmless) until
      # the marker catches up.
      - name: Record the published commit (move dev-published marker)
        if: steps.push.outputs.pushed == 'true'
        continue-on-error: true
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git push --force origin "${COMMIT_SHA}:refs/tags/dev-published"
