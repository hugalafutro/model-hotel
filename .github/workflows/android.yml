name: Android

on:
  push:
    branches: [master]
    paths:
      - "android/**"
      - "testdata/quota-contract/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [master]
    paths:
      - "android/**"
      - "testdata/quota-contract/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

# Cancel superseded runs when a PR branch is force-pushed/updated, but never
# cancel in-flight runs on master itself.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Bellhop (lint + test + build)
    runs-on: ubuntu-latest
    # The whole job normally finishes in ~5 min; a deadlocked test JVM once
    # sat silent for hours, so cap it well above normal and far below never.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Android Lint
        run: ./gradlew lint

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bellhop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
