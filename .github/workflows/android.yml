name: Android

on:
  push:
    branches: [master]
    paths:
      - "android/**"
      - "testdata/quota-contract/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [master]
    paths:
      - "android/**"
      - "testdata/quota-contract/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

# Cancel superseded runs when a PR branch is force-pushed/updated, but never
# cancel in-flight runs on master itself.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Bellhop (lint + test + build)
    runs-on: ubuntu-latest
    # The whole job normally finishes in ~5 min; a deadlocked test JVM once
    # sat silent for hours, so cap it well above normal and far below never.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Android Lint
        run: ./gradlew lint

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bellhop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
