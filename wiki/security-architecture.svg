<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" role="img" aria-label="Request Security Pipeline Diagram">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <!-- Background (transparent) -->
  <rect width="900" height="1100" fill="none" rx="0"/>
  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="600" fill="#f8fafc">Request Security Pipeline</text>
  <text x="450" y="66" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="12" fill="#64748b">order of the middleware chain in cmd/server (global first, then per route)</text>
  <!-- 1. Security Headers (every response) -->
  <rect x="150" y="80" width="600" height="130" fill="#1e293b" rx="12" filter="url(#shadow)" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="150" y="80" width="600" height="36" fill="#4ade80" opacity="0.15" rx="12"/>
  <clipPath id="cp1"><rect x="150" y="80" width="600" height="130" rx="12"/></clipPath>
  <g clip-path="url(#cp1)">
    <text x="450" y="105" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600" fill="#4ade80">1. Security Headers (every response)</text>
  </g>
  <text x="450" y="138" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">X-Content-Type-Options: nosniff, X-Frame-Options: DENY (unless ALLOW_EMBED)</text>
  <text x="450" y="160" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">Referrer-Policy, Strict-Transport-Security (when TLS)</text>
  <text x="450" y="182" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">Content-Security-Policy (frame-ancestors none unless ALLOW_EMBED)</text>
  <line x1="450" y1="210" x2="450" y2="230" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 2. CORS Middleware -->
  <rect x="250" y="230" width="400" height="110" fill="#1e293b" rx="12" filter="url(#shadow)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="250" y="230" width="400" height="36" fill="#38bdf8" opacity="0.15" rx="12"/>
  <clipPath id="cp2"><rect x="250" y="230" width="400" height="110" rx="12"/></clipPath>
  <g clip-path="url(#cp2)">
    <text x="450" y="255" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600" fill="#38bdf8">2. CORS Middleware</text>
  </g>
  <text x="450" y="288" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">Origin allowlist (CORS_ORIGINS), preflight caching (24h)</text>
  <text x="450" y="310" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">Credentials allowed</text>
  <line x1="450" y1="340" x2="450" y2="360" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 3. Request Size Limiting -->
  <rect x="200" y="360" width="500" height="85" fill="#1e293b" rx="12" filter="url(#shadow)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="200" y="360" width="500" height="36" fill="#10b981" opacity="0.15" rx="12"/>
  <clipPath id="cp3"><rect x="200" y="360" width="500" height="85" rx="12"/></clipPath>
  <g clip-path="url(#cp3)">
    <text x="450" y="385" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600" fill="#10b981">3. Request Size Limiting</text>
  </g>
  <text x="450" y="418" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">MAX_REQUEST_SIZE default 50MB (1KB to 100MB), via http.MaxBytesReader</text>
  <line x1="450" y1="445" x2="450" y2="465" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 4. IP Rate Limiter (DoS Protection) -->
  <rect x="150" y="465" width="600" height="110" fill="#1e293b" rx="12" filter="url(#shadow)" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="150" y="465" width="600" height="36" fill="#3b82f6" opacity="0.15" rx="12"/>
  <clipPath id="cp4"><rect x="150" y="465" width="600" height="110" rx="12"/></clipPath>
  <g clip-path="url(#cp4)">
    <text x="450" y="490" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600" fill="#3b82f6">4. IP Rate Limiter (DoS Protection)</text>
  </g>
  <text x="450" y="523" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">Token bucket per IP, mounted on /api, /api/chat and /v1 ahead of auth</text>
  <text x="450" y="545" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">30 RPS default / 60 burst, respects X-Forwarded-For behind trusted proxy</text>
  <line x1="450" y1="575" x2="450" y2="595" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Box 5: Split into two paths -->
  <rect x="250" y="595" width="400" height="40" fill="#1e293b" rx="8" stroke="#475569" stroke-width="1.5"/>
  <text x="450" y="620" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">5. Authentication Split</text>
  <line x1="350" y1="635" x2="250" y2="660" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="635" x2="650" y2="660" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 5a. Admin API Path (/api/*) -->
  <rect x="50" y="660" width="380" height="130" fill="#1e293b" rx="12" filter="url(#shadow)" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="50" y="660" width="380" height="36" fill="#a78bfa" opacity="0.15" rx="12"/>
  <clipPath id="cp5a"><rect x="50" y="660" width="380" height="130" rx="12"/></clipPath>
  <g clip-path="url(#cp5a)">
    <text x="240" y="685" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#a78bfa">5a. Admin API Path (/api/*)</text>
  </g>
  <text x="240" y="718" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="11" fill="#94a3b8">Public, no auth: config, demo login and the sign-in routes</text>
  <text x="240" y="740" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="11" fill="#94a3b8">(token exchange, passkey, password, TOTP, OIDC, GitHub)</text>
  <text x="240" y="762" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="11" fill="#94a3b8">Rest: admin token (SHA-256) or HttpOnly session cookie</text>
  <text x="240" y="784" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="11" fill="#f87171">HTTP 401 on failure &#183; CSRF 403 on cookie-authed writes</text>
  <!-- 5b. Proxy API Path (/v1/*) -->
  <rect x="470" y="660" width="380" height="130" fill="#1e293b" rx="12" filter="url(#shadow)" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="470" y="660" width="380" height="36" fill="#f59e0b" opacity="0.15" rx="12"/>
  <clipPath id="cp5b"><rect x="470" y="660" width="380" height="130" rx="12"/></clipPath>
  <g clip-path="url(#cp5b)">
    <text x="660" y="685" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#f59e0b">5b. Proxy API Path (/v1/*)</text>
  </g>
  <text x="660" y="718" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="11" fill="#94a3b8">Virtual Key Validation</text>
  <text x="660" y="740" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="11" fill="#94a3b8">Bearer or x-api-key sk-..., SHA-256 hash + DB lookup</text>
  <text x="660" y="762" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="11" fill="#94a3b8">last-used timestamp updated async</text>
  <text x="660" y="784" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="11" fill="#f87171">HTTP 401 on a bad key or a disabled owner account</text>
  <line x1="240" y1="790" x2="350" y2="840" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="790" x2="550" y2="840" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 6. Usage Rate Limiters (after auth) -->
  <rect x="200" y="840" width="500" height="125" fill="#1e293b" rx="12" filter="url(#shadow)" stroke="#f472b6" stroke-width="1.5"/>
  <rect x="200" y="840" width="500" height="36" fill="#f472b6" opacity="0.15" rx="12"/>
  <clipPath id="cp6"><rect x="200" y="840" width="500" height="125" rx="12"/></clipPath>
  <g clip-path="url(#cp6)">
    <text x="450" y="865" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600" fill="#f472b6">6. Usage Limiters (after auth)</text>
  </g>
  <text x="450" y="898" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">Proxy path: key + owner RPS/burst, then TPM, then dollar budget</text>
  <text x="450" y="920" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">Admin chat: RPS per client address, TPM + budget per user</text>
  <text x="450" y="942" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">RPS waits rate_limit_max_wait_ms; TPM 429s at once; budget 429/503</text>
  <line x1="450" y1="965" x2="450" y2="985" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Target Handler -->
  <rect x="325" y="990" width="250" height="55" fill="#0f172a" rx="12" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="1023" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600" fill="#34d399">Target Handler</text>
</svg>
