<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 510" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background (transparent) -->
  <rect width="820" height="510" fill="none" rx="8"/>

  <!-- Plane labels -->
  <text x="24" y="26" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1">DATA PLANE  ·  request path</text>
  <text x="24" y="292" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1">CONTROL PLANE</text>
  <text x="24" y="307" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1">never in the request path</text>

  <!-- Divider between planes -->
  <line x1="24" y1="265" x2="796" y2="265" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Clients -->
  <rect x="24" y="48" width="120" height="64" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="84" y="80" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="700">Clients</text>
  <text x="84" y="99" text-anchor="middle" fill="#94a3b8" font-size="10">API traffic</text>

  <!-- Clients -> TLS proxy -->
  <line x1="144" y1="80" x2="192" y2="80" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- TLS proxy -->
  <rect x="192" y="48" width="144" height="64" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="264" y="80" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="700">TLS proxy</text>
  <text x="264" y="99" text-anchor="middle" fill="#94a3b8" font-size="10">HTTPS ingress (you provide)</text>

  <!-- TLS proxy -> Traefik -->
  <line x1="336" y1="80" x2="384" y2="80" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Traefik -->
  <rect x="384" y="48" width="156" height="64" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="462" y="78" text-anchor="middle" fill="#34d399" font-size="15" font-weight="700">Traefik :8080</text>
  <text x="462" y="99" text-anchor="middle" fill="#94a3b8" font-size="10">load-balances the fleet</text>

  <!-- Traefik -> members -->
  <line x1="540" y1="72" x2="604" y2="52" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="540" y1="88" x2="604" y2="132" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="540" y1="104" x2="604" y2="212" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- hotel-1 -->
  <rect x="608" y="24" width="148" height="56" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="682" y="49" text-anchor="middle" fill="#fb7185" font-size="14" font-weight="700">hotel-1</text>
  <text x="682" y="67" text-anchor="middle" fill="#94a3b8" font-size="10">ip1:8081</text>

  <!-- hotel-2 -->
  <rect x="608" y="104" width="148" height="56" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="682" y="129" text-anchor="middle" fill="#fb7185" font-size="14" font-weight="700">hotel-2</text>
  <text x="682" y="147" text-anchor="middle" fill="#94a3b8" font-size="10">ip2:8081</text>

  <!-- hotel-N: the fleet is not capped at two, dashed to read as "and so on" -->
  <rect x="608" y="184" width="148" height="56" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#shadow)"/>
  <text x="682" y="209" text-anchor="middle" fill="#fb7185" font-size="14" font-weight="700">… hotel-N</text>
  <text x="682" y="227" text-anchor="middle" fill="#94a3b8" font-size="10">add more members</text>

  <!-- You, in a browser -->
  <rect x="24" y="330" width="150" height="64" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="99" y="362" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700">You, in a browser</text>
  <text x="99" y="381" text-anchor="middle" fill="#94a3b8" font-size="10">admin UI</text>

  <!-- You -> TLS proxy -> Front Desk (the admin UI rides the same HTTPS ingress) -->
  <polyline points="174,362 230,362 230,114" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
  <polyline points="320,112 320,346 382,346" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Front Desk -->
  <rect x="384" y="306" width="156" height="80" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="462" y="334" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="700">Front Desk :8090</text>
  <text x="462" y="354" text-anchor="middle" fill="#94a3b8" font-size="10">add · drain · remove members</text>
  <text x="462" y="370" text-anchor="middle" fill="#94a3b8" font-size="10">sync config · watch health</text>

  <!-- Front Desk <-> Traefik: Traefik polls its config, Front Desk reads serverStatus -->
  <line x1="462" y1="304" x2="462" y2="114" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="6,4" marker-start="url(#arrP)" marker-end="url(#arrP)"/>
  <text x="478" y="236" fill="#c4b5fd" font-size="10" font-weight="600">Traefik polls</text>
  <text x="478" y="250" fill="#94a3b8" font-size="10">GET /traefik/config · ~5s</text>
  <text x="454" y="236" text-anchor="end" fill="#c4b5fd" font-size="10" font-weight="600">Front Desk reads</text>
  <text x="454" y="250" text-anchor="end" fill="#94a3b8" font-size="10">API :8081 serverStatus</text>

  <!-- Front Desk -> members (control traffic, off the request path) -->
  <polyline points="540,320 790,320 790,52" fill="none" stroke="#a78bfa" stroke-width="1.6"/>
  <line x1="790" y1="52" x2="758" y2="52" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#arrP)"/>
  <line x1="790" y1="132" x2="758" y2="132" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#arrP)"/>
  <line x1="790" y1="212" x2="758" y2="212" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#arrP)"/>
  <text x="556" y="296" fill="#c4b5fd" font-size="10" font-weight="600">polls health + version</text>
  <text x="556" y="310" fill="#94a3b8" font-size="10">pushes config sync, heartbeat, quota</text>

  <!-- Optional: Apprise alerts -->
  <line x1="462" y1="386" x2="462" y2="422" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="470" y="408" fill="#94a3b8" font-size="10">alerts</text>
  <rect x="384" y="424" width="156" height="60" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#shadow)"/>
  <text x="462" y="450" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="700">apprise-api</text>
  <text x="462" y="468" text-anchor="middle" fill="#94a3b8" font-size="10">optional · any Apprise target</text>

  <!-- Optional: Bellhop -->
  <line x1="540" y1="454" x2="606" y2="454" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="573" y="446" text-anchor="middle" fill="#94a3b8" font-size="10">ntfy push</text>
  <rect x="608" y="424" width="148" height="60" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#shadow)"/>
  <text x="682" y="450" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700">Bellhop</text>
  <text x="682" y="468" text-anchor="middle" fill="#94a3b8" font-size="10">optional · Android app</text>
  <!-- Bellhop polls Front Desk with its device token -->
  <line x1="650" y1="424" x2="542" y2="374" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="606" y="384" fill="#94a3b8" font-size="10">polls</text>
</svg>
